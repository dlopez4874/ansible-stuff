---
# aur_audit.yml — AUR Malware Audit Playbook (multi-campaign)
#
# Checks Arch Linux nodes for indicators of compromise from the ongoing series
# of AUR supply-chain attacks. Each campaign has a different delivery shape, so
# the checks are grouped by shape, not by date.
#
# June 2026 "Atomic Arch" (Sonatype-2026-003775):
#   Wave 1 (Jun 10-12): PKGBUILDs injected npm/bun to pull atomic-lockfile or
#     js-digest, dropping a Rust infostealer ('deps') and optional eBPF rootkit.
#   Wave 2 (Jun 13-15): Same technique, hex/octal-obfuscated shell to evade
#     literal string grep.
#   Wave 3 (Jun 14-15): post_install hooks inject Cyrillic spam into shell rc
#     files. Vandalism, no infostealer.
#
# July-August 2026 account-takeover wave — DIFFERENT SHAPE, STILL ONGOING:
#   Compromised/adopted maintainer accounts push a precompiled ~50KB ELF
#   committed directly into the package's own AUR git tree, invoked from
#   build(). Named to look like an ordinary build helper (linter, minifier,
#   hasher, converter, parser, validator, assembler, optimizer, translator).
#   No JS runtime required, so §3/§5/§10/§13 do not see it — §15/§16 do.
#   Arch disabled package adoption 2026-07-30 and disabled pushes entirely
#   2026-08-01. Treat the window as open-ended until Arch reopens pushes.
#
# References:
#   https://github.com/lenucksi/aur-malware-check
#   https://archlinux.org/news/active-aur-malicious-packages-incident/
#   https://www.phoronix.com/news/Arch-Linux-AUR-Russian-Spam
#   adoption disabled / pushes disabled (aur-general, 2026-07-30 / 2026-08-01):
#     https://lists.archlinux.org/archives/list/aur-general@lists.archlinux.org/thread/DRDEU3JUSC72CB265XHXPFA3DFSLXPBP/
#   hundreds of packages, committed ELF (aur-general, 2026-07-30):
#     https://lists.archlinux.org/archives/list/aur-general@lists.archlinux.org/thread/BU6RECTA5DTJBL7Q4NQI5T3AKIN2FWSF/
#
# NOTE ON COVERAGE: as of 2026-08-07 the community IOC repo (lenucksi) has no
# campaign data for the July-August wave — its last push predates it. §2 reports
# that gap explicitly rather than implying coverage. §15/§16 are shape-based
# detection, not hash-based: no payload hashes have been published for this wave.
#
# Usage:
#   ansible-playbook aur_audit.yml
#   ansible-playbook aur_audit.yml -e "critical_date=2026-06-08"
#   ansible-playbook aur_audit.yml --tags fetch
#
# Output: ./aur_audit_results/<hostname>.txt on the control node.

- name: AUR Malware Audit — multi-campaign (June 2026 + July-August 2026 waves)
  hosts: arch
  become: true
  gather_facts: true
  vars:
    report_path: "/tmp/aur_audit_{{ inventory_hostname }}.txt"
    # §1 writes this once; §6/§15/§16 read it so install-date parsing has a
    # single implementation instead of four copies of the same date regex.
    pkgdate_cache: "/tmp/aur_audit_pkgdates_{{ inventory_hostname }}.tsv"
    fetch_dest: "./aur_audit_results/"
    # Filesystem-mtime baseline for §9/§14 (earliest campaign date minus a day).
    critical_date: "2026-06-09"

    # Campaign windows. Checked against real install dates (date -d parsed to
    # ISO), not literal month-name regexes — so a new window needs no code edit.
    # The July window ends "today" because the campaign is still open.
    ioc_windows:
      - id: "jun-w1"
        start: "2026-06-10"
        end: "2026-06-12"
        label: "Jun 2026 wave 1 - npm/atomic-lockfile"
      - id: "jun-w2"
        start: "2026-06-13"
        end: "2026-06-15"
        label: "Jun 2026 wave 2/3 - bun obfuscated + Cyrillic spam"
      - id: "jul-takeover"
        start: "2026-07-28"
        end: "{{ ansible_date_time.date }}"
        label: "Jul-Aug 2026 takeover - committed ELF dropper (ONGOING)"

    # Confirmed attacker accounts. arojas is deliberately NOT here (legitimate
    # Arch Trusted User: Antonio Rojas, arojas@archlinux.org).
    # List + join, not a folded scalar: YAML folding turned the old '>-' block
    # into alternatives with a leading space, so those names only matched when
    # preceded by whitespace.
    ioc_accounts_list:
      - herbsobering
      - custodiatovar
      - veramagalhaes
      - franziskaweber
      - tobiaswesterburg
      - ellenmyklebust
      - ivonahruskova
      - simongeisler
      - zxp19821005
      - roantielemans          # Jul-Aug wave: pushed the org-cli Tor backdoor
    ioc_accounts: "{{ ioc_accounts_list | join('|') }}"

    ioc_packages_list:
      - atomic-lockfile
      - js-digest
      - lockfile-js
      - ansi-colors
    ioc_packages: "{{ ioc_packages_list | join('|') }}"

    # Jul-Aug wave: ELF committed into the AUR git tree, named as a build helper.
    ioc_payload_names_list:
      - linter
      - minifier
      - hasher
      - converter
      - parser
      - validator
      - assembler
      - optimizer
      - translator
    ioc_payload_names: "{{ ioc_payload_names_list | join('|') }}"

    # Packages named on aur-general for the Jul-Aug wave. NOT exhaustive —
    # "hundreds" were reported and no complete list has been published.
    ioc_jul_packages_list:
      - openconnect-sso
      - org-cli
      - proxypin
      - plex-media-player
      - brave-origin
      - meshcore-open-git
      - android-riscv64-libxinerama
      - python-roman-numerals
      - editorconfiger
      - deeploy-bin
      - lyrical-git
      - calendula-git
      - archutil
      - bigwebapp-manager
      - boringssl-git
      - cinnamon-no-nemo
      - windscribe-cli-v2-bin
    ioc_jul_packages: "{{ ioc_jul_packages_list | join('|') }}"

    # Jul-Aug wave commit metadata: author spoofed as the GitHub Actions bot,
    # subject "Add missing deps" (org-cli, b505e8cd..., 2026-07-30 15:36:23 UTC).
    ioc_commit_markers: 'github-actions\[bot\]|Add missing deps'

    # June wave sudo password grabber (campaigns.json ioc_files).
    ioc_sudo_grabber_sha256: "fd4852334ce1c2d7c9bf0e1c91dbf274a1247989b4827d4f7758cbf3bf42ebfe"

    # Community IOC index. The repo restructured into a Python package: the old
    # main/packages.txt and main/aur_check-v2.sh are both 404 now.
    campaign_index_base: "https://raw.githubusercontent.com/lenucksi/aur-malware-check/master/"
    aur_rpc_url: "https://aur.archlinux.org/rpc/v5/info"
    tor_ports: "9001|9030|9050|9051|9150"
    # §12: a loopback listener is "explained" if a known port OR a known process
    # owns it. Process-based matters more — k3s opens ports beyond any fixed list
    # (6444 supervisor, 10258) and a port-only allowlist false-positives on them.
    expected_listener_ports: "22|53|5355|6443|6444|8080|2379|2380|9099|10010|10248|10249|10250|10256|10257|10258|10259"
    expected_listener_procs: "k3s-server|k3s-agent|k3s|containerd|containerd-shim|kubelet|etcd|coredns|sshd|systemd-resolve|systemd-resolved|chronyd|dbus-daemon"

  tasks:

    # ── Setup ────────────────────────────────────────────────────────────────
    - name: Remove any previous report file
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ report_path }}"
        - "{{ pkgdate_cache }}"
      tags: [always]

    - name: Write report header
      copy:
        dest: "{{ report_path }}"
        content: |
          ================================================================================
            AUR Malware Audit — multi-campaign
            Host      : {{ inventory_hostname }}
            Run Time  : {{ ansible_date_time.iso8601 }}
            Campaigns : Jun 2026 "Atomic Arch" waves 1-3 (Sonatype-2026-003775)
                        Jul-Aug 2026 account takeover / committed ELF (ONGOING)
            Windows   : {% for w in ioc_windows %}{{ w.id }} {{ w.start }}..{{ w.end }}{% if not loop.last %} | {% endif %}{% endfor %}

            IOC Ref   : https://github.com/lenucksi/aur-malware-check
            Note      : Jul-Aug wave detection is shape-based (committed ELF,
                        maintainer change). No payload hashes published yet.
          ================================================================================
      tags: [always]

    # ── §1 AUR packages + install dates ──────────────────────────────────────
    # Parses each install date to ISO via `date -d` and compares against the
    # ioc_windows list, then caches pkg/date/window to pkgdate_cache for §6/§15/§16.
    - name: "[1] AUR packages and install dates"
      shell: |
        {
          echo ""
          echo "========================================"
          echo " [1] AUR PACKAGES + INSTALL DATES"
          echo "========================================"
          WINDOWS='{% for w in ioc_windows %}{{ w.id }},{{ w.start }},{{ w.end }},{{ w.label }};{% endfor %}'
          echo "[!] Windows checked:"
          IFS=';' read -ra WLIST <<< "$WINDOWS"
          for W in "${WLIST[@]}"; do
            [ -n "$W" ] || continue
            IFS=',' read -r WID WSTART WEND WLABEL <<< "$W"
            printf '      %-14s %s .. %s  (%s)\n' "$WID" "$WSTART" "$WEND" "$WLABEL"
          done
          echo ""
          : > "{{ pkgdate_cache }}"
          pacman -Qqm | while read -r pkg; do
            IDATE_RAW=$(pacman -Qi "$pkg" 2>/dev/null \
              | sed -n 's/^Install Date\s*:\s*//p')
            IDATE=$(date -d "$IDATE_RAW" +%Y-%m-%d 2>/dev/null || echo "unknown")
            VER=$(pacman -Qi "$pkg" 2>/dev/null | sed -n 's/^Version\s*:\s*//p')
            HIT_ID="-"
            HIT_LABEL=""
            for W in "${WLIST[@]}"; do
              [ -n "$W" ] || continue
              IFS=',' read -r WID WSTART WEND WLABEL <<< "$W"
              if [ "$IDATE" != "unknown" ] \
                 && [ ! "$IDATE" \< "$WSTART" ] && [ ! "$IDATE" \> "$WEND" ]; then
                HIT_ID="$WID"
                HIT_LABEL="$WLABEL"
                break
              fi
            done
            printf '%s\t%s\t%s\n' "$pkg" "$IDATE" "$HIT_ID" >> "{{ pkgdate_cache }}"
            if [ "$HIT_ID" != "-" ]; then
              echo "[!! IN WINDOW: ${HIT_ID} !!] ${pkg} ${VER} installed ${IDATE} — ${HIT_LABEL}"
            else
              echo "[ ok ]                ${pkg} ${VER} installed ${IDATE}"
            fi
          done
          echo ""
          if [ ! -s "{{ pkgdate_cache }}" ]; then
            echo "[info] No foreign (AUR) packages installed on this host."
          fi
          echo ""
        } >> {{ report_path }}
      args:
        executable: /bin/bash
      ignore_errors: true
      changed_when: true
      tags: [audit]

    # ── §2 Community compromised package list cross-reference ─────────────────
    # The repo moved to branch master and split its data per campaign under
    # data/campaigns.json, so the old main/packages.txt URL 404s. This reads the
    # campaign index and every list it points at, and reports whether the index
    # actually covers the currently-open window.
    - name: "[2] Cross-reference against community compromised package lists"
      shell: |
        {
          echo ""
          echo "========================================"
          echo " [2] COMMUNITY COMPROMISED PACKAGE LIST CROSS-REFERENCE"
          echo "========================================"
          echo "[!] Index: {{ campaign_index_base }}data/campaigns.json"
          echo ""
          if ! command -v python3 >/dev/null 2>&1; then
            echo "[SKIP] python3 not available — cannot parse the campaign index."
          else
            INSTALLED_PKGS="$(pacman -Qqm 2>/dev/null)" \
            BASE="{{ campaign_index_base }}" \
            OPEN_WINDOW_START="{{ ioc_windows | map(attribute='start') | max }}" \
            python3 - <<'PYEOF'
        import json, os, sys, urllib.request

        base = os.environ["BASE"]
        installed = {p.strip() for p in os.environ["INSTALLED_PKGS"].split() if p.strip()}
        open_start = os.environ["OPEN_WINDOW_START"]

        def fetch(url):
            with urllib.request.urlopen(url, timeout=20) as r:
                return r.read().decode("utf-8", "replace")

        try:
            index = json.loads(fetch(base + "data/campaigns.json"))
        except Exception as exc:
            print("[SKIP] Could not fetch campaign index: %s" % exc)
            print("       Node may have no internet access. Verify manually at:")
            print("       https://github.com/lenucksi/aur-malware-check")
            sys.exit(0)

        campaigns = index.get("campaigns", [])
        print("[info] %d campaign(s) in the community index:" % len(campaigns))
        covers_open = False
        for c in campaigns:
            win = c.get("date_window") or {}
            start, end = win.get("start", "?"), win.get("end", "?")
            print("       - %-14s %s  (%s .. %s)"
                  % (c.get("id", "?"), c.get("display", "?"), start, end))
            if end != "?" and end >= open_start:
                covers_open = True
        print("")

        if not covers_open:
            print("[WARN] No campaign in the community index covers the currently-open")
            print("       window (starts %s). The Jul-Aug 2026 takeover wave is NOT" % open_start)
            print("       represented in this data — §15/§16 are the only coverage for it.")
            print("")

        hits, checked = [], 0
        for c in campaigns:
            for rel in (c.get("lists") or []) + (c.get("npm_lists") or []):
                try:
                    body = fetch(base + rel)
                except Exception as exc:
                    print("[SKIP] %s: %s" % (rel, exc))
                    continue
                names = {n.strip() for n in body.splitlines()
                         if n.strip() and not n.strip().startswith("#")}
                checked += len(names)
                for bad in sorted(names & installed):
                    hits.append((bad, c.get("id", "?"), rel))

        print("[info] %d known-bad names checked against %d installed AUR package(s)."
              % (checked, len(installed)))
        if hits:
            for bad, cid, rel in hits:
                print("[!! MATCH !!] %s is listed in campaign '%s' (%s)" % (bad, cid, rel))
            print("[SUMMARY: FAIL — COMPROMISED PACKAGE(S) DETECTED — see above]")
        else:
            print("[SUMMARY: PASS — No installed AUR package appears in any campaign list]")
        PYEOF
          fi
          echo ""
        } >> {{ report_path }}
      args:
        executable: /bin/bash
      ignore_errors: true
      changed_when: true
      tags: [audit]

    # ── §3 PKGBUILD cache — Wave 1 IOC string scan ───────────────────────────
    # Scoped to PKGBUILD/install/.SRCINFO files only — excludes src/ to avoid
    # false positives from extracted source trees (e.g. Python 2.7.18 distutils).
    - name: "[3] PKGBUILD cache — Wave 1 IOC string scan (PKGBUILD/install files only)"
      shell: |
        {
          echo ""
          echo "========================================"
          echo " [3] PKGBUILD CACHE — WAVE 1 IOC STRING SCAN"
          echo "========================================"
          echo "[!] Patterns: malicious npm/bun package names, attacker account names,"
          echo "[!]           and AUR packages named for the Jul-Aug takeover wave."
          echo "[!] Scope: PKGBUILD, *.install, .SRCINFO files only (not source trees)"
          echo ""
          IOC_PATTERN='{{ ioc_packages }}|{{ ioc_accounts }}|{{ ioc_jul_packages }}'
          FOUND=0
          for CACHE_DIR in /root/.cache/yay /root/.cache/paru /home/*/.cache/yay /home/*/.cache/paru; do
            [ -d "$CACHE_DIR" ] || continue
            echo "--- Scanning: ${CACHE_DIR} ---"
            RESULT=$(find "$CACHE_DIR" -maxdepth 2 \
              \( -name "PKGBUILD" -o -name "*.install" -o -name ".SRCINFO" \) \
              -print0 2>/dev/null \
              | xargs -0 grep -lInE "${IOC_PATTERN}" 2>/dev/null)
            if [ -n "$RESULT" ]; then
              echo "[!! MATCH FOUND !!]"
              echo "$RESULT" | while read -r f; do
                echo "  File: $f"
                grep -nE "${IOC_PATTERN}" "$f"
              done
              FOUND=1
            else
              echo "[clean — no Wave 1 IOC strings found in ${CACHE_DIR}]"
            fi
            echo ""
          done
          [ "$FOUND" -gt 0 ] \
            && echo "[SUMMARY: REVIEW] Wave 1 IOC strings detected — see above." \
            || true
        } >> {{ report_path }}
      ignore_errors: true
      changed_when: true
      tags: [audit]

    # ── §4 PKGBUILD cache — Wave 2 obfuscated shell detection ────────────────
    # Wave 2 used hex ($'\x63') and octal ($'\143') escaping to hide commands
    # from literal string grep. grep -P (PCRE) catches these patterns.
    - name: "[4] PKGBUILD cache — Wave 2 obfuscated shell detection"
      shell: |
        {
          echo ""
          echo "========================================"
          echo " [4] PKGBUILD CACHE — WAVE 2 OBFUSCATED SHELL DETECTION"
          echo "========================================"
          echo "[!] Wave 2 hid commands using hex (\\x63) and octal (\\143) escaping."
          echo "[!] e.g. \$'\\x63'"d" \"/\"'t'"m"'p' = 'cd /tmp' with each char escaped."
          echo ""
          OBFUSC_PATTERN='\\x[0-9a-fA-F]{2}|\\[0-7]{3}'
          FOUND=0
          for CACHE_DIR in /root/.cache/yay /root/.cache/paru /home/*/.cache/yay /home/*/.cache/paru; do
            [ -d "$CACHE_DIR" ] || continue
            echo "--- Scanning: ${CACHE_DIR} ---"
            RESULT=$(find "$CACHE_DIR" -maxdepth 2 \
              \( -name "PKGBUILD" -o -name "*.install" -o -name ".SRCINFO" \) \
              -print0 2>/dev/null \
              | xargs -0 grep -lInP "${OBFUSC_PATTERN}" 2>/dev/null)
            if [ -n "$RESULT" ]; then
              echo "[!! POTENTIAL MATCH !!] (manual review required — may be legitimate)"
              echo "$RESULT" | while read -r f; do
                echo "  File: $f"
                grep -nP "${OBFUSC_PATTERN}" "$f"
              done
              FOUND=1
            else
              echo "[clean — no Wave 2 obfuscation patterns found in ${CACHE_DIR}]"
            fi
            echo ""
          done
          [ "$FOUND" -gt 0 ] \
            && echo "[SUMMARY: REVIEW] Possible Wave 2 obfuscation detected — manual PKGBUILD review needed." \
            || true
        } >> {{ report_path }}
      ignore_errors: true
      changed_when: true
      tags: [audit]

    # ── §5 PKGBUILD cache — suspicious install hooks and JS runtimes ──────────
    - name: "[5] PKGBUILD cache — suspicious install hooks and JS runtimes"
      shell: |
        {
          echo ""
          echo "========================================"
          echo " [5] PKGBUILD CACHE — SUSPICIOUS HOOKS AND JS RUNTIME INVOCATIONS"
          echo "========================================"
          echo "[!] Flagging: npm install/ci, bun add/install/x, yarn add, pnpm add"
          echo "[!] Scope: PKGBUILD, *.install, .SRCINFO files only"
          echo "[!] Jul-Aug wave note: plex-media-player was hit via npm install in an"
          echo "[!] orphaned package, so this check still applies to that wave."
          echo ""
          HOOK_PATTERN='npm (install|ci)|bun (add|install|x)|yarn add|pnpm add|npx |bunx '
          FOUND=0
          for CACHE_DIR in /root/.cache/yay /root/.cache/paru /home/*/.cache/yay /home/*/.cache/paru; do
            [ -d "$CACHE_DIR" ] || continue
            echo "--- ${CACHE_DIR} ---"
            RESULT=$(find "$CACHE_DIR" -maxdepth 2 \
              \( -name "PKGBUILD" -o -name "*.install" -o -name ".SRCINFO" \) \
              -print0 2>/dev/null \
              | xargs -0 grep -lInE "${HOOK_PATTERN}" 2>/dev/null)
            if [ -n "$RESULT" ]; then
              echo "[!! JS RUNTIME INVOCATION FOUND !!]"
              echo "$RESULT" | while read -r f; do
                echo "  File: $f"
                grep -nE "${HOOK_PATTERN}" "$f"
              done
              FOUND=1
            else
              echo "[clean — no JS runtime invocations found in ${CACHE_DIR}]"
            fi
            echo ""
          done
          [ "$FOUND" -gt 0 ] \
            && echo "[SUMMARY: REVIEW] JS runtime invocations detected in PKGBUILD cache." \
            || true
        } >> {{ report_path }}
      ignore_errors: true
      changed_when: true
      tags: [audit]

    # ── §6 Critical-window PKGBUILD content dump ─────────────────────────────
    - name: "[6] Critical-window packages — cached PKGBUILD content dump"
      shell: |
        {
          echo ""
          echo "========================================"
          echo " [6] CRITICAL-WINDOW PACKAGES — CACHED PKGBUILD DUMP"
          echo "========================================"
          echo "[!] Dumps the cached PKGBUILD for any package installed inside a window."
          echo "[!] Absent PKGBUILD = cache was cleaned after install."
          echo ""
          if [ ! -f "{{ pkgdate_cache }}" ]; then
            echo "[SKIP] {{ pkgdate_cache }} missing — run §1 first."
          else
            ANY=0
            while IFS=$'\t' read -r PKG IDATE WID; do
              [ "$WID" = "-" ] && continue
              ANY=1
              echo ""
              echo "  Package  : $PKG"
              echo "  Installed: $IDATE  (window: $WID)"
              PKG_FOUND=0
              for CACHE_DIR in /root/.cache/yay /root/.cache/paru \
                               /home/*/.cache/yay /home/*/.cache/paru; do
                PBFILE="${CACHE_DIR}/${PKG}/PKGBUILD"
                if [ -f "$PBFILE" ]; then
                  PKG_FOUND=1
                  echo "  Source   : ${PBFILE}"
                  echo "  --- BEGIN PKGBUILD ---"
                  cat "$PBFILE"
                  echo "  --- END PKGBUILD ---"
                fi
              done
              [ $PKG_FOUND -eq 0 ] && echo "  [PKGBUILD not in cache — verify at https://aur.archlinux.org/packages/${PKG}]"
            done < "{{ pkgdate_cache }}"
            [ $ANY -eq 0 ] && echo "  [No packages fall within any campaign window]"
          fi
          echo ""
        } >> {{ report_path }}
      args:
        executable: /bin/bash
      ignore_errors: true
      changed_when: true
      tags: [audit]

    # ── §7 Stale yay/paru cache packages ─────────────────────────────────────
    - name: "[7] Stale yay/paru cache packages (cached but not installed)"
      shell: |
        {
          echo ""
          echo "========================================"
          echo " [7] STALE CACHE PACKAGES (cached but not installed)"
          echo "========================================"
          echo "[!] Not a direct IOC — useful context for explaining §3/§4/§15 matches."
          echo ""
          INSTALLED=$(pacman -Qqm 2>/dev/null | sort)
          for CACHE_DIR in /root/.cache/yay /root/.cache/paru \
                           /home/*/.cache/yay /home/*/.cache/paru; do
            [ -d "$CACHE_DIR" ] || continue
            echo "--- ${CACHE_DIR} ---"
            FOUND_STALE=0
            for PKG_DIR in "${CACHE_DIR}"/*/; do
              [ -d "$PKG_DIR" ] || continue
              PKG=$(basename "$PKG_DIR")
              if ! echo "$INSTALLED" | grep -qx "$PKG"; then
                echo "  [stale] $PKG"
                FOUND_STALE=1
              fi
            done
            [ $FOUND_STALE -eq 0 ] && echo "  [none — cache matches installed package list]"
            echo ""
          done
        } >> {{ report_path }}
      ignore_errors: true
      changed_when: true
      tags: [audit]

    # ── §8 eBPF rootkit artifacts ─────────────────────────────────────────────
    - name: "[8] eBPF rootkit artifacts"
      shell: |
        {
          echo ""
          echo "========================================"
          echo " [8] eBPF ROOTKIT ARTIFACTS"
          echo "========================================"
          echo "[!] Primary IOC: any hidden_* entries in /sys/fs/bpf/"
          echo "[!] Clean system: only . and .. with no loaded BPF programs."
          echo ""
          echo "--- /sys/fs/bpf/ listing ---"
          ls -la /sys/fs/bpf/ 2>/dev/null || echo "[/sys/fs/bpf/ not accessible]"
          echo ""
          echo "--- bpftool prog show ---"
          bpftool prog show 2>/dev/null || echo "[bpftool not available or no BPF programs loaded]"
          echo ""
          echo "--- bpftool map show ---"
          bpftool map show 2>/dev/null || echo "[bpftool not available or no BPF maps loaded]"
          echo ""
        } >> {{ report_path }}
      ignore_errors: true
      changed_when: true
      tags: [audit]

    # ── §9 Systemd persistence ────────────────────────────────────────────────
    - name: "[9] Systemd units modified after {{ critical_date }}"
      shell: |
        {
          echo ""
          echo "========================================"
          echo " [9] SYSTEMD PERSISTENCE — UNITS MODIFIED AFTER {{ critical_date }}"
          echo "========================================"
          echo "[!] Flag: unfamiliar .service or .timer in /etc/systemd/system."
          echo ""
          echo "--- /etc/systemd/system ---"
          RESULTS=$(find /etc/systemd/system -newermt "{{ critical_date }}" -type f 2>/dev/null | sort)
          [ -n "$RESULTS" ] && echo "$RESULTS" || echo "[none found]"
          echo ""
          echo "--- /var/lib (new top-level dirs) ---"
          RESULTS=$(find /var/lib -maxdepth 1 -type d -newermt "{{ critical_date }}" 2>/dev/null | sort)
          [ -n "$RESULTS" ] && echo "$RESULTS" || echo "[none found]"
          echo ""
          echo "--- user systemd dirs ---"
          FOUND_USER=0
          for UHOME in /root /home/*; do
            UDIR="${UHOME}/.config/systemd/user"
            [ -d "$UDIR" ] || continue
            FOUND_USER=1
            echo "  ${UDIR}:"
            RESULTS=$(find "$UDIR" -maxdepth 1 -newermt "{{ critical_date }}" -type f 2>/dev/null | sort)
            [ -n "$RESULTS" ] && echo "$RESULTS" || echo "    [none found]"
          done
          [ $FOUND_USER -eq 0 ] && echo "  [no user systemd dirs found]"
          echo ""
        } >> {{ report_path }}
      ignore_errors: true
      changed_when: true
      tags: [audit]

    # ── §10 npm/bun cache artifacts ───────────────────────────────────────────
    - name: "[10] npm/bun cache — malicious package artifacts"
      shell: |
        {
          echo ""
          echo "========================================"
          echo " [10] NPM / BUN CACHE — MALICIOUS PACKAGE ARTIFACTS"
          echo "========================================"
          echo "--- Directories named atomic-lockfile, js-digest, lockfile-js ---"
          RESULTS=$(find /root /home -type d \
            \( -name "atomic-lockfile" -o -name "js-digest" -o -name "lockfile-js" \) \
            2>/dev/null | sort)
          [ -n "$RESULTS" ] && echo "$RESULTS" || echo "[none found]"
          echo ""
          echo "--- npm cache JSON refs to malicious packages ---"
          RESULTS=$(find /root/.npm /home/*/.npm -name "*.json" 2>/dev/null \
            | xargs grep -lE '{{ ioc_packages }}|{{ ioc_accounts }}' 2>/dev/null)
          [ -n "$RESULTS" ] && echo "$RESULTS" || echo "[none found]"
          echo ""
          echo "--- bun cache dirs ---"
          RESULTS=$(find /root/.bun /home/*/.bun -type d \
            \( -name "atomic-lockfile" -o -name "js-digest" \) \
            2>/dev/null | sort)
          [ -n "$RESULTS" ] && echo "$RESULTS" || echo "[none found]"
          echo ""
        } >> {{ report_path }}
      ignore_errors: true
      changed_when: true
      tags: [audit]

    # ── §11 Dropper binary search ─────────────────────────────────────────────
    # Uses variable capture (not && echo) so exit code reflects find errors,
    # not whether results were found (find exits 0 either way).
    # Broadened past the literal name 'deps': the Jul-Aug wave names its payload
    # after ordinary build helpers, and June also dropped a sudo password grabber.
    - name: "[11] Dropper binary search (deps + Jul-Aug payload names + sudo grabber)"
      shell: |
        {
          echo ""
          echo "========================================"
          echo " [11] DROPPER BINARY SEARCH"
          echo "========================================"
          echo "[!] June wave : Rust ELF64 'deps' dropped by atomic-lockfile preinstall."
          echo "[!] Jul-Aug   : ELF named {{ ioc_payload_names }}."
          echo "[!] June wave : sudo password grabber at ~/.local/bin/sudo"
          echo "[!]             sha256 {{ ioc_sudo_grabber_sha256 }}"
          echo ""
          NAME_ARGS=( -name "deps" )
          IFS='|' read -ra PAYLOAD_NAMES <<< "{{ ioc_payload_names }}"
          for N in "${PAYLOAD_NAMES[@]}"; do
            NAME_ARGS+=( -o -name "$N" )
          done
          echo "--- /tmp, /var/tmp, /run ---"
          HITS=$(find /tmp /var/tmp /run -type f \( "${NAME_ARGS[@]}" \) 2>/dev/null)
          if [ -n "$HITS" ]; then
            echo "[!! FOUND — treat as compromised !!]"
            echo "$HITS" | while read -r f; do
              echo "  $f  ($(stat -c%s "$f" 2>/dev/null) bytes)"
            done
          else
            echo "[not found]"
          fi
          echo ""
          echo "--- /root and /home (excluding build caches) ---"
          HITS=$(find /root /home -type f \( "${NAME_ARGS[@]}" \) \
            ! -path "*/.cache/yay/*" ! -path "*/.cache/paru/*" 2>/dev/null)
          if [ -n "$HITS" ]; then
            echo "[!! FOUND — treat as compromised !!]"
            echo "$HITS" | while read -r f; do
              echo "  $f  ($(stat -c%s "$f" 2>/dev/null) bytes)"
            done
          else
            echo "[not found]"
          fi
          echo ""
          echo "--- sudo password grabber (~/.local/bin/sudo) ---"
          GRABBER=0
          for UHOME in /root /home/*; do
            SUDOBIN="${UHOME}/.local/bin/sudo"
            [ -f "$SUDOBIN" ] || continue
            GRABBER=1
            SUM=$(sha256sum "$SUDOBIN" 2>/dev/null | awk '{print $1}')
            if [ "$SUM" = "{{ ioc_sudo_grabber_sha256 }}" ]; then
              echo "[!! SUDO GRABBER — exact hash match, treat as compromised !!] $SUDOBIN"
            else
              echo "[!! FOUND — a user-writable 'sudo' shadowing the real one is suspicious !!]"
              echo "  $SUDOBIN  sha256 $SUM  (does not match the known June hash)"
            fi
          done
          [ $GRABBER -eq 0 ] && echo "[not found]"
          echo ""
        } >> {{ report_path }}
      args:
        executable: /bin/bash
      ignore_errors: true
      changed_when: true
      tags: [audit]

    # ── §12 Active network connections ────────────────────────────────────────
    - name: "[12] Active network connections, Tor indicators and listeners"
      shell: |
        {
          echo ""
          echo "========================================"
          echo " [12] NETWORK — CONNECTIONS, TOR INDICATORS, LISTENERS"
          echo "========================================"
          echo "[!] Expected on k3s nodes: :6443 (API server), :10250 (kubelet), SSH."
          echo "[!] Tor is a strong IOC — the Jul-Aug wave's org-cli payload was a Tor"
          echo "[!] backdoor, and the dropper analysis flagged odd localhost ports."
          echo ""
          echo "--- established non-loopback connections ---"
          ss -tnp 2>/dev/null | grep -v '127\.0\.0\.\|::1' \
            || echo "[no non-loopback connections or ss unavailable]"
          echo ""
          echo "--- Tor port check ({{ tor_ports }}) ---"
          TORCONN=$(ss -tnp 2>/dev/null | grep -E ':({{ tor_ports }})[[:space:]]|:({{ tor_ports }})$')
          if [ -n "$TORCONN" ]; then
            echo "[!! TOR CONNECTION — treat as compromised !!]"
            echo "$TORCONN"
          else
            echo "[clean — no connections on known Tor ports]"
          fi
          echo ""
          echo "--- Tor binaries / units present ---"
          TORBIN=""
          for T in tor torsocks tor-browser obfs4proxy snowflake-client; do
            P=$(command -v "$T" 2>/dev/null)
            [ -n "$P" ] && TORBIN="${TORBIN}  ${T} -> ${P}"$'\n'
          done
          TORUNIT=$(systemctl list-unit-files 2>/dev/null | grep -iE '^tor(@|\.|-)' || true)
          if [ -n "$TORBIN" ] || [ -n "$TORUNIT" ]; then
            echo "[!! TOR SOFTWARE PRESENT — not expected on a k3s node !!]"
            [ -n "$TORBIN" ] && printf '%s' "$TORBIN"
            [ -n "$TORUNIT" ] && echo "$TORUNIT"
          else
            echo "[clean — no Tor binaries or units found]"
          fi
          echo ""
          echo "--- all listeners (full context, review by hand) ---"
          ss -tlnp 2>/dev/null || echo "[ss unavailable]"
          echo ""
          echo "--- loopback listeners outside the expected k3s/system set ---"
          echo "[!] Review-level, not proof: an unexplained localhost listener is how the"
          echo "[!] dropper's local control channel showed up in the published analysis."
          UNEXPECTED=$(ss -tlnp 2>/dev/null \
            | awk 'NR>1 && ($4 ~ /^127\.0\.0\.1:/ || $4 ~ /^\[::1\]:/)' \
            | grep -vE ':({{ expected_listener_ports }})[[:space:]]' \
            | grep -vE '"({{ expected_listener_procs }})"' \
            || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "[review] Loopback listener(s) not in the expected set:"
            echo "$UNEXPECTED"
            echo "[SUMMARY: REVIEW] Unexplained loopback listener — confirm the owning process."
          else
            echo "[clean — no unexpected loopback listeners]"
          fi
          echo ""
        } >> {{ report_path }}
      args:
        executable: /bin/bash
      ignore_errors: true
      changed_when: true
      tags: [audit]

    # ── §13 Unexpected JS runtime presence ───────────────────────────────────
    - name: "[13] Unexpected JS runtime presence (node, bun, npm)"
      shell: |
        {
          echo ""
          echo "========================================"
          echo " [13] UNEXPECTED RUNTIME PRESENCE (node, npm, bun, yarn, pnpm)"
          echo "========================================"
          echo "[!] None of these should be present on a k3s node."
          echo "[!] Strong IOC for the June waves — those cannot execute without one."
          echo "[!] NOT a gate for the Jul-Aug wave: its payload is a committed ELF and"
          echo "[!] needs no JS runtime. Absence here does not clear that wave — see §15."
          echo ""
          FOUND_RT=0
          for CMD in node npm bun npx yarn pnpm; do
            PATH_RESULT=$(command -v "$CMD" 2>/dev/null)
            if [ -n "$PATH_RESULT" ]; then
              VERSION=$("$CMD" --version 2>/dev/null || echo "unknown")
              echo "[!! FOUND !!] ${CMD} -> ${PATH_RESULT}  (${VERSION})"
              FOUND_RT=1
            else
              echo "[absent]      ${CMD}"
            fi
          done
          echo ""
          if [ $FOUND_RT -eq 0 ]; then
            echo "[SUMMARY: PASS — No JS runtimes present]"
          else
            echo "[SUMMARY: REVIEW — JS runtime(s) found — verify they are intentional]"
          fi
          echo ""
        } >> {{ report_path }}
      ignore_errors: true
      changed_when: true
      tags: [audit]

    # ── §14 Shell config injection — Wave 3 Russian spam ─────────────────────
    # Wave 3 (Jun 14-15): attackers injected Cyrillic messages into ~/.bashrc,
    # ~/.zshrc, ~/.config/fish/config.fish via post_install hooks in 70+ packages
    # (mostly Python/Ruby ecosystem and llama.cpp). Pure vandalism, no infostealer.
    - name: "[14] Shell config injection — Wave 3 Russian spam (June 2026)"
      shell: |
        {
          echo ""
          echo "========================================"
          echo " [14] SHELL CONFIG INJECTION — WAVE 3 RUSSIAN SPAM"
          echo "========================================"
          echo "[!] Wave 3 injected Cyrillic text into shell configs via post_install hooks."
          echo "[!] Affected: ~70+ packages, mostly Python/Ruby/llama.cpp ecosystem."
          echo "[!] Scope: ~/.bashrc, ~/.zshrc, ~/.bash_profile, ~/.profile, fish config."
          echo ""
          FOUND=0
          for UHOME in /root /home/*; do
            [ -d "$UHOME" ] || continue
            UNAME=$(basename "$UHOME")
            for SHELLRC in \
              "${UHOME}/.bashrc" \
              "${UHOME}/.zshrc" \
              "${UHOME}/.bash_profile" \
              "${UHOME}/.profile" \
              "${UHOME}/.config/fish/config.fish"; do
              [ -f "$SHELLRC" ] || continue
              echo "--- Checking: ${SHELLRC} ---"
              # Check for Cyrillic characters (Unicode block U+0400-U+04FF)
              if LC_ALL=C grep -qP "\x{0400}" "$SHELLRC" 2>/dev/null \
                || LC_ALL=C grep -qP "[\xd0-\xd3][\x80-\xbf]" "$SHELLRC" 2>/dev/null; then
                echo "[!! CYRILLIC TEXT DETECTED !!]"
                grep -n "." "$SHELLRC" | LC_ALL=C grep -P "[\xd0-\xd3][\x80-\xbf]"
                FOUND=1
              fi
              # Check if file was modified after the attack window opened
              if find "$SHELLRC" -newermt "{{ critical_date }}" 2>/dev/null | grep -q .; then
                echo "[MODIFIED after {{ critical_date }}]"
                INJECTIONS=$(grep -nE \
                  'curl [^|]|wget [^|]|base64 |eval \$|echo.*https?://|\$\(curl|\$\(wget' \
                  "$SHELLRC" 2>/dev/null)
                if [ -n "$INJECTIONS" ]; then
                  echo "[!! SUSPICIOUS INJECTION PATTERNS !!]"
                  echo "$INJECTIONS"
                  FOUND=1
                else
                  echo "  [modified but no suspicious download/eval patterns found]"
                fi
              else
                echo "  [not modified since {{ critical_date }}]"
              fi
              echo ""
            done
          done
          echo "--- /etc/profile.d/ scripts modified after {{ critical_date }} ---"
          PROFILED=$(find /etc/profile.d/ -newermt "{{ critical_date }}" -type f 2>/dev/null | sort)
          if [ -n "$PROFILED" ]; then
            echo "$PROFILED"
            echo "$PROFILED" | while read -r f; do
              SUSPICIOUS=$(LC_ALL=C grep -nP "[\xd0-\xd3][\x80-\xbf]|curl |wget |base64 |eval " "$f" 2>/dev/null)
              [ -n "$SUSPICIOUS" ] && echo "  [SUSPICIOUS] $f:" && echo "$SUSPICIOUS" && FOUND=1
            done
          else
            echo "[none found]"
          fi
          echo ""
          if [ $FOUND -eq 0 ]; then
            echo "[SUMMARY: PASS — No shell config injection detected]"
          else
            echo "[SUMMARY: REVIEW — Shell config injection detected — review above]"
          fi
          echo ""
        } >> {{ report_path }}
      ignore_errors: true
      changed_when: true
      tags: [audit]

    # ── §15 Committed ELF in the AUR git tree — Jul-Aug 2026 wave ────────────
    # The July-August wave commits a precompiled ELF into the package's own AUR
    # git repo and calls it from build(). §3/§4/§5 cannot see it: they only read
    # PKGBUILD/*.install/.SRCINFO, and the payload is a binary blob elsewhere in
    # the tree.
    #
    # Discriminator: yay/paru cache dirs ARE git clones of the AUR repo, so an
    # attacker-committed blob is TRACKED BY GIT while ordinary build output is
    # not. Scanning for "any ELF under the cache" is useless — python2's own
    # build tree alone yields 20+ .o files per node. `git ls-files` is precise.
    - name: "[15] Committed ELF / suspicious blobs in AUR git trees (Jul-Aug 2026 wave)"
      shell: |
        {
          echo ""
          echo "========================================"
          echo " [15] COMMITTED ELF IN AUR GIT TREE (JUL-AUG 2026 WAVE)"
          echo "========================================"
          echo "[!] Only git-TRACKED files are considered: a tracked ELF was committed by"
          echo "[!] whoever controls the AUR repo. Untracked ELFs are ordinary build output."
          echo "[!] Also checks commit metadata: authors spoofed as github-actions[bot],"
          echo "[!] the subject 'Add missing deps', and known attacker accounts."
          echo ""
          if ! command -v git >/dev/null 2>&1; then
            echo "[SKIP] git not installed — cannot inspect AUR git trees."
          else
            FOUND=0
            REVIEW=0
            SCANNED=0
            for CACHE_DIR in /root/.cache/yay /root/.cache/paru /home/*/.cache/yay /home/*/.cache/paru; do
              [ -d "$CACHE_DIR" ] || continue
              echo "--- ${CACHE_DIR} ---"
              for PKG_DIR in "${CACHE_DIR}"/*/; do
                [ -d "$PKG_DIR" ] || continue
                PKG=$(basename "$PKG_DIR")
                if [ ! -e "${PKG_DIR}.git" ]; then
                  echo "  [no git tree] ${PKG} — cannot verify what was committed"
                  REVIEW=1
                  continue
                fi
                SCANNED=$((SCANNED+1))
                TRACKED=$(git -C "$PKG_DIR" ls-files 2>/dev/null)
                while IFS= read -r REL; do
                  [ -n "$REL" ] || continue
                  F="${PKG_DIR}${REL}"
                  [ -f "$F" ] || continue
                  MAGIC=$(head -c4 "$F" 2>/dev/null | od -An -tx1 | tr -d ' \n')
                  BASE=$(basename "$REL")
                  if [ "$MAGIC" = "7f454c46" ]; then
                    echo "  [!! COMMITTED ELF IN AUR GIT TREE !!] ${PKG}: ${REL} ($(stat -c%s "$F" 2>/dev/null) bytes)"
                    git -C "$PKG_DIR" log -1 \
                      --format='      commit %H%n      author %an <%ae>%n      date   %aI%n      subject %s' \
                      -- "$REL" 2>/dev/null
                    FOUND=1
                  elif echo "$BASE" | grep -qxE '{{ ioc_payload_names }}'; then
                    echo "  [review] ${PKG}: tracked file '${REL}' matches Jul-Aug payload naming (not an ELF)"
                    REVIEW=1
                  fi
                done <<TRACKEDEOF
        $TRACKED
        TRACKEDEOF
                SPOOF=$(git -C "$PKG_DIR" log --all \
                  --format='      %H | %an <%ae> | %aI | %s' 2>/dev/null \
                  | grep -E '{{ ioc_commit_markers }}|{{ ioc_accounts }}' || true)
                if [ -n "$SPOOF" ]; then
                  echo "  [!! SPOOFED / ATTACKER COMMIT METADATA !!] ${PKG}"
                  echo "$SPOOF"
                  FOUND=1
                fi
              done
              echo ""
            done
            echo "[info] ${SCANNED} AUR git tree(s) inspected."
            if [ $FOUND -gt 0 ]; then
              echo "[SUMMARY: FAIL — committed binary or attacker commit metadata found]"
            elif [ $REVIEW -gt 0 ]; then
              echo "[SUMMARY: REVIEW — see [review] lines above]"
            else
              echo "[SUMMARY: PASS — no committed ELF or suspicious commit metadata]"
            fi
          fi
          echo ""
        } >> {{ report_path }}
      args:
        executable: /bin/bash
      ignore_errors: true
      changed_when: true
      tags: [audit]

    # ── §16 AUR maintainer / adoption state — Jul-Aug 2026 wave ──────────────
    # Entry vector for this wave was the AUR account layer, not the PKGBUILD:
    # attackers adopted orphaned packages or took over existing accounts, then
    # pushed. So the maintainer field and last-modified time are the IOCs.
    # Arch disabled adoption 2026-07-30 and pushes 2026-08-01.
    - name: "[16] AUR maintainer / adoption state for installed foreign packages"
      shell: |
        {
          echo ""
          echo "========================================"
          echo " [16] AUR MAINTAINER / ADOPTION STATE"
          echo "========================================"
          echo "[!] Flags: orphaned (adoption target), maintainer is a known attacker"
          echo "[!]        account, package modified inside an open campaign window,"
          echo "[!]        or package no longer exists in the AUR (possibly removed"
          echo "[!]        for malware while still installed here)."
          echo ""
          if ! command -v python3 >/dev/null 2>&1; then
            echo "[SKIP] python3 not available — cannot query the AUR RPC."
          else
            INSTALLED_PKGS="$(pacman -Qqm 2>/dev/null)" \
            RPC_URL="{{ aur_rpc_url }}" \
            BAD_ACCOUNTS="{{ ioc_accounts_list | join(',') }}" \
            NAMED_JUL="{{ ioc_jul_packages_list | join(',') }}" \
            WINDOWS="{% for w in ioc_windows %}{{ w.id }},{{ w.start }},{{ w.end }};{% endfor %}" \
            python3 - <<'PYEOF'
        import json, os, sys, urllib.parse, urllib.request
        from datetime import datetime, timezone

        installed = sorted({p.strip() for p in os.environ["INSTALLED_PKGS"].split() if p.strip()})
        if not installed:
            print("[info] No foreign (AUR) packages installed — nothing to check.")
            sys.exit(0)

        bad = {a.strip() for a in os.environ["BAD_ACCOUNTS"].split(",") if a.strip()}
        named = {n.strip() for n in os.environ["NAMED_JUL"].split(",") if n.strip()}
        windows = []
        for chunk in os.environ["WINDOWS"].split(";"):
            if chunk.strip():
                wid, start, end = chunk.split(",")
                windows.append((wid, start, end))

        def aur_name(pkg):
            # makepkg debug split packages (foo-debug) are built locally and never
            # exist in the AUR on their own — their provenance is the base package.
            # Looking them up directly returns "not found" for every single one.
            return pkg[:-6] if pkg.endswith("-debug") else pkg

        lookups = sorted({aur_name(p) for p in installed})
        query = urllib.parse.urlencode([("arg[]", p) for p in lookups])
        try:
            with urllib.request.urlopen(os.environ["RPC_URL"] + "?" + query, timeout=25) as r:
                payload = json.loads(r.read().decode("utf-8", "replace"))
        except Exception as exc:
            print("[SKIP] Could not reach the AUR RPC: %s" % exc)
            print("       Node may have no internet access. Check by hand at")
            print("       https://aur.archlinux.org/packages/<name>")
            sys.exit(0)

        results = {e.get("Name"): e for e in payload.get("results", [])}
        fail = review = 0

        for pkg in installed:
            look = aur_name(pkg)
            label = pkg if look == pkg else "%s (debug split of %s)" % (pkg, look)
            entry = results.get(look)
            if entry is None:
                print("[review] %-32s NOT FOUND in the AUR — deleted or renamed upstream." % label)
                print("         A package removed for malware still shows as installed here.")
                review = 1
                continue

            maint = entry.get("Maintainer")
            last = entry.get("LastModified")
            when = "unknown"
            if isinstance(last, int):
                when = datetime.fromtimestamp(last, timezone.utc).strftime("%Y-%m-%d")

            flags = []
            if maint in bad:
                flags.append("!! KNOWN-BAD MAINTAINER: %s" % maint)
                fail = 1
            if not maint:
                flags.append("ORPHANED — adoption target for the Jul-Aug wave")
                review = 1
            if look in named or entry.get("PackageBase") in named:
                flags.append("named on aur-general for the Jul-Aug wave")
                fail = 1
            for wid, start, end in windows:
                if when != "unknown" and start <= when <= end:
                    flags.append("last pushed %s — inside window %s" % (when, wid))
                    review = 1
            if entry.get("OutOfDate"):
                flags.append("flagged out-of-date upstream")

            if flags:
                marker = "[!!]" if any(f.startswith("!!") or "named on" in f for f in flags) else "[review]"
                print("%s %-32s maintainer=%s last=%s" % (marker, label, maint or "(orphaned)", when))
                for f in flags:
                    print("        - %s" % f.lstrip("! "))
            else:
                print("[ ok ]   %-32s maintainer=%s last=%s" % (label, maint, when))

        print("")
        if fail:
            print("[SUMMARY: FAIL — attacker-controlled or wave-named package installed]")
        elif review:
            print("[SUMMARY: REVIEW — orphaned / recently-pushed / missing packages above]")
        else:
            print("[SUMMARY: PASS — every installed AUR package has a maintainer and no window hits]")
        PYEOF
          fi
          echo ""
        } >> {{ report_path }}
      args:
        executable: /bin/bash
      ignore_errors: true
      changed_when: true
      tags: [audit]

    # ── Overall verdict ───────────────────────────────────────────────────────
    - name: Write overall verdict
      shell: |
        {
          echo ""
          echo "========================================"
          echo " OVERALL VERDICT"
          echo "========================================"
          REPORT="{{ report_path }}"
          if grep -qE '\[!! (MATCH FOUND|MATCH|FOUND|CYRILLIC TEXT DETECTED|JS RUNTIME INVOCATION|SUSPICIOUS INJECTION|COMMITTED ELF IN AUR GIT TREE|SPOOFED / ATTACKER COMMIT METADATA|SUDO GRABBER|TOR CONNECTION|TOR SOFTWARE PRESENT)' "$REPORT" 2>/dev/null \
             || grep -qE '^\[!!\]' "$REPORT" 2>/dev/null; then
            echo "  !! COMPROMISED / REVIEW REQUIRED !!"
            echo "  One or more high-confidence IOCs were detected. See flagged sections above."
            echo "  Recommended actions:"
            echo "    1. Isolate the node from the network immediately."
            echo "    2. Rotate all credentials (SSH keys, tokens, cloud API keys)."
            echo "    3. Boot from live media and inspect flagged files from a trusted OS."
            echo "    4. Consider full reinstall — eBPF rootkits cannot be fully cleaned in-place."
            echo "    5. For Wave 3 spam only: edit the flagged shell config file to remove injected lines."
            echo "    6. For a committed ELF (§15): the AUR account is the breach, not just"
            echo "       this node. Report it to aur-general and check every host that built it."
          elif grep -qE '\[SUMMARY: (REVIEW|FAIL)' "$REPORT" 2>/dev/null; then
            echo "  REVIEW — Low-confidence flags present, manual verification recommended."
            echo "  No high-confidence IOCs detected, but some findings warrant inspection."
          else
            echo "  CLEAN — No IOCs detected on this node."
            echo "  All checks passed for both the June 2026 and Jul-Aug 2026 campaigns."
          fi
          echo ""
          echo "  Authoritative second opinion (community tool, now a Python package —"
          echo "  the old aur_check-v2.sh URL is gone):"
          echo "    git clone https://github.com/lenucksi/aur-malware-check"
          echo "    python -m aur_check --scan-all-homes"
          echo "    # or: integration/aur-malware-check.sh"
          echo "  Its data does NOT yet cover the Jul-Aug 2026 wave — see §2, §15, §16."
          echo "========================================"
          echo ""
        } >> {{ report_path }}
      ignore_errors: true
      changed_when: true
      tags: [audit]

    # ── Fetch & cleanup ───────────────────────────────────────────────────────
    - name: Fetch report to control node
      fetch:
        src: "{{ report_path }}"
        dest: "{{ fetch_dest }}"
        flat: true
      tags: [fetch]

    - name: Remove report and cache files from remote node
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ report_path }}"
        - "{{ pkgdate_cache }}"
      tags: [fetch]
