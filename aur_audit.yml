---
# aur_audit.yml — AUR Malware Audit Playbook (multi-campaign)
#
# Checks Arch Linux nodes for indicators of compromise from the ongoing series
# of AUR supply-chain attacks. Each campaign has a different delivery shape, so
# the checks are grouped by shape, not by date.
#
# June 2026 "Atomic Arch" (Sonatype-2026-003775):
#   Wave 1 (Jun 10-12): PKGBUILDs injected npm/bun to pull atomic-lockfile or
#     js-digest, dropping a Rust infostealer ('deps') and optional eBPF rootkit.
#   Wave 2 (Jun 13-15): Same technique, hex/octal-obfuscated shell to evade
#     literal string grep.
#   Wave 3 (Jun 14-15): post_install hooks inject Cyrillic spam into shell rc
#     files. Vandalism, no infostealer.
#
# July-August 2026 account-takeover wave — DIFFERENT SHAPE, STILL ONGOING:
#   Compromised/adopted maintainer accounts push a precompiled ~50KB ELF
#   committed directly into the package's own AUR git tree, invoked from
#   build(). Named to look like an ordinary build helper (linter, minifier,
#   hasher, converter, parser, validator, assembler, optimizer, translator).
#   No JS runtime required, so §3/§5/§10/§13 do not see it — §15/§16 do.
#   Arch disabled package adoption 2026-07-30 and disabled pushes entirely
#   2026-08-01. Pushes reopened ~2026-08-11 (aurweb 6.5.0); adoption is still
#   disabled. storageexplorer-bin (lourencopaiva) carried a dormant 'optimizer'.
#
# August-October 2026, after pushes reopened — SEVERAL SHAPES, STILL ONGOING:
#   a) Backdoor in the install scriptlet / build(): x11-qemu-validation (sudo
#      user + password sshd), hyprland-fixes (attacker ssh key, root sshd on
#      3333/4444, Tailscale, SUID-root helpers + hourly timer, log wipe),
#      gentor (build() runs `sudo ./setup`), xsnow/xsnow-bin ('systemmanager'
#      fetched over Tor), fsearch-bin ('linter'). §5/§18.
#   b) hellscripter worm (DirtyBlanket npm campaign, 2026-09-29; AUR typosquats
#      yyay & co. by marchos1as, 2026-10-13): .install pipes linux.sh from
#      web.archive.org/codeberg/gitflic into bash as root. Drops CHAOS RAT as
#      'systemd-fontrenderd'/'systemd-fontcached' (chattr +i, Tor C2), then
#      spreads over SSH using local keys + known_hosts and pushes the same
#      loader into every AUR package those keys can reach. §3/§5/§17/§19.
#   c) Malicious upstream, benign PKGBUILD: glanced (.vscode folderOpen task),
#      plasma6-applet-quicklaunch (GitHub Actions cred exfil). Not executed by
#      a plain makepkg build — name match only (§3/§16).
#
# References:
#   https://github.com/lenucksi/aur-malware-check
#   https://archlinux.org/news/active-aur-malicious-packages-incident/
#   https://www.phoronix.com/news/Arch-Linux-AUR-Russian-Spam
#   adoption disabled / pushes disabled (aur-general, 2026-07-30 / 2026-08-01):
#     https://lists.archlinux.org/archives/list/aur-general@lists.archlinux.org/thread/DRDEU3JUSC72CB265XHXPFA3DFSLXPBP/
#   hundreds of packages, committed ELF (aur-general, 2026-07-30):
#     https://lists.archlinux.org/archives/list/aur-general@lists.archlinux.org/thread/BU6RECTA5DTJBL7Q4NQI5T3AKIN2FWSF/
#   Aug-Oct reports (aur-general, mail-archive mirror; lists.archlinux.org is
#   behind Anubis): https://www.mail-archive.com/aur-general@lists.archlinux.org/
#     msg02738 storageexplorer-bin   msg02763 xsnow        msg02786 hyprland-fixes
#     msg02799 gentor                msg02860 x11-qemu-validation
#     msg02868 pingwin840            msg02930 fsearch-bin  msg02840 glanced
#     msg02968 plasma6-applet-quicklaunch                  msg02983 marchos1as/yyay
#   hellscripter worm / CHAOS RAT IOCs:
#     https://safedep.io/dirtyblanket-express-impersonation-npm/
#     https://osv.dev/vulnerability/MAL-2026-17242
#
# NOTE ON COVERAGE: as of 2026-10-20 the community IOC repo (lenucksi) still has
# no campaign data after June 2026. §2 reports that gap explicitly rather than
# implying coverage. §15/§16/§18 are shape-based; §17 and ioc_sha256_list carry
# the only published payload hashes (hellscripter, storageexplorer 'optimizer').
#
# Usage:
#   ansible-playbook aur_audit.yml
#   ansible-playbook aur_audit.yml -e "critical_date=2026-06-08"
#   ansible-playbook aur_audit.yml --tags fetch
#
# Output: ./aur_audit_results/<hostname>.txt on the control node.

- name: AUR Malware Audit — multi-campaign (June 2026 through October 2026 waves)
  hosts: arch
  become: true
  gather_facts: true
  vars:
    report_path: "/tmp/aur_audit_{{ inventory_hostname }}.txt"
    # §1 writes this once; §6/§15/§16 read it so install-date parsing has a
    # single implementation instead of four copies of the same date regex.
    pkgdate_cache: "/tmp/aur_audit_pkgdates_{{ inventory_hostname }}.tsv"
    fetch_dest: "./aur_audit_results/"
    # Filesystem-mtime baseline for §9/§14 (earliest campaign date minus a day).
    critical_date: "2026-06-09"

    # Campaign windows. Checked against real install dates (date -d parsed to
    # ISO), not literal month-name regexes — so a new window needs no code edit.
    # The last window ends "today" because the campaigns are still open.
    ioc_windows:
      - id: "jun-w1"
        start: "2026-06-10"
        end: "2026-06-12"
        label: "Jun 2026 wave 1 - npm/atomic-lockfile"
      - id: "jun-w2"
        start: "2026-06-13"
        end: "2026-06-15"
        label: "Jun 2026 wave 2/3 - bun obfuscated + Cyrillic spam"
      - id: "jul-takeover"
        start: "2026-07-28"
        end: "2026-08-10"
        label: "Jul-Aug 2026 takeover - committed ELF dropper"
      - id: "post-reopen"
        start: "2026-08-11"
        end: "{{ ansible_date_time.date }}"
        label: "Aug-Oct 2026 - scriptlet backdoors, hellscripter worm, typosquats (ONGOING)"

    # Confirmed attacker accounts. arojas is deliberately NOT here (legitimate
    # Arch Trusted User: Antonio Rojas, arojas@archlinux.org).
    # List + join, not a folded scalar: YAML folding turned the old '>-' block
    # into alternatives with a leading space, so those names only matched when
    # preceded by whitespace.
    ioc_accounts_list:
      - herbsobering
      - custodiatovar
      - veramagalhaes
      - franziskaweber
      - tobiaswesterburg
      - ellenmyklebust
      - ivonahruskova
      - simongeisler
      - zxp19821005
      - roantielemans          # Jul-Aug wave: pushed the org-cli Tor backdoor
      - lourencopaiva          # Jul-Aug wave: storageexplorer-bin 'optimizer'
      - pingwin840             # Sep 2026: orphan takeovers, Russian rc-file spam
      - marchos1as             # Oct 2026: yay/paru typosquats, hellscripter loader
    ioc_accounts: "{{ ioc_accounts_list | join('|') }}"

    ioc_packages_list:
      - atomic-lockfile
      - js-digest
      - lockfile-js
      - ansi-colors
    ioc_packages: "{{ ioc_packages_list | join('|') }}"

    # Jul-Aug wave: ELF committed into the AUR git tree, named as a build helper.
    ioc_payload_names_list:
      - linter
      - minifier
      - hasher
      - converter
      - parser
      - validator
      - assembler
      - optimizer
      - translator
      - systemmanager          # xsnow/xsnow-bin, Aug 2026, fetched over Tor
    ioc_payload_names: "{{ ioc_payload_names_list | join('|') }}"

    # Packages named on aur-general since July. NOT exhaustive — "hundreds"
    # were reported and no complete list has been published (marchos1as's
    # typosquats were deleted before anyone listed them; §19 covers those).
    ioc_named_packages_list:
      - openconnect-sso
      - org-cli
      - proxypin
      - plex-media-player
      - brave-origin
      - meshcore-open-git
      - android-riscv64-libxinerama
      - python-roman-numerals
      - editorconfiger
      - deeploy-bin
      - lyrical-git
      - calendula-git
      - archutil
      - bigwebapp-manager
      - boringssl-git
      - cinnamon-no-nemo
      - windscribe-cli-v2-bin
      # Aug-Oct 2026
      - storageexplorer-bin
      - xsnow
      - xsnow-bin
      - hyprland-fixes
      - gentor
      - x11-qemu-validation
      - fsearch-bin
      - glanced
      - plasma6-applet-quicklaunch
      - yyay
    ioc_named_packages: "{{ ioc_named_packages_list | join('|') }}"

    # Jul-Aug wave commit metadata: author spoofed as the GitHub Actions bot,
    # subject "Add missing deps" (org-cli, b505e8cd..., 2026-07-30 15:36:23 UTC);
    # "Mohd Lee" authored the storageexplorer-bin 'optimizer' commit (031bed62).
    ioc_commit_markers: 'github-actions\[bot\]|Add missing deps|Mohd Lee'

    # Literal strings that only show up in these campaigns' PKGBUILD/.install
    # files and payloads. Regex-safe as written (dots match any char, harmless).
    ioc_strings_list:
      - hellscripter                     # codeberg/gitflic account hosting linux.sh
      - gitflic.ru
      - systemd-fontrenderd              # CHAOS RAT service names
      - systemd-fontcached
      - systemd-fontd
      - s5n2uyo6gb6dhirsm5pihwohi6e7ayrwojx4xjow4cqabmbowpezenid   # CHAOS C2 onion
      - iusearch-hyprlandbtw             # hyprland-fixes upstream
      - 100.70.123.108                   # hyprland-fixes Tailscale peer
    ioc_strings: "{{ ioc_strings_list | join('|') }}"

    # June wave sudo password grabber (campaigns.json ioc_files).
    ioc_sudo_grabber_sha256: "fd4852334ce1c2d7c9bf0e1c91dbf274a1247989b4827d4f7758cbf3bf42ebfe"

    # Every published payload hash, for the sweeps in §15 and §17.
    ioc_sha256_list:
      - { sha256: "fd4852334ce1c2d7c9bf0e1c91dbf274a1247989b4827d4f7758cbf3bf42ebfe", label: "June sudo password grabber" }
      - { sha256: "5bf2071c83872fc9b3fb3f664f4d3a376c811fc01e1656afc62632b2fac4f646", label: "storageexplorer-bin optimizer ELF" }
      - { sha256: "65f0a95b24e30305146346cbc2452cfabadab9e1ca35053e1134b67c38919577", label: "hellscripter linux.sh worm" }
      - { sha256: "2c9dbc14809f1e1aebda114194368b002acf74c8760b88fc101f625d179793c2", label: "hellscripter systemd-fontd CHAOS RAT" }
    ioc_sha256_table: "{% for h in ioc_sha256_list %}{{ h.sha256 }} {{ h.label }}\n{% endfor %}"

    # Community IOC index. The repo restructured into a Python package: the old
    # main/packages.txt and main/aur_check-v2.sh are both 404 now.
    campaign_index_base: "https://raw.githubusercontent.com/lenucksi/aur-malware-check/master/"
    aur_rpc_url: "https://aur.archlinux.org/rpc/v5/info"
    tor_ports: "9001|9030|9050|9051|9150"
    # §12: a loopback listener is "explained" if a known port OR a known process
    # owns it. Process-based matters more — k3s opens ports beyond any fixed list
    # (6444 supervisor, 10258) and a port-only allowlist false-positives on them.
    expected_listener_ports: "22|53|5355|6443|6444|8080|2379|2380|9099|10010|10248|10249|10250|10256|10257|10258|10259"
    expected_listener_procs: "k3s-server|k3s-agent|k3s|containerd|containerd-shim|kubelet|etcd|coredns|sshd|systemd-resolve|systemd-resolved|chronyd|dbus-daemon"
    # §18: interactive accounts (UID 1000-59999) expected on these nodes.
    expected_login_users: "daniel"
    # §18: k3s/containerd image layers are full of unowned SUID binaries.
    suid_prune_paths: "/var/lib/rancher /var/lib/kubelet /var/lib/containerd /run/k3s /run/containerd"

  tasks:

    # ── Setup ────────────────────────────────────────────────────────────────
    - name: Remove any previous report file
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ report_path }}"
        - "{{ pkgdate_cache }}"
      tags: [always]

    - name: Write report header
      copy:
        dest: "{{ report_path }}"
        content: |
          ================================================================================
            AUR Malware Audit — multi-campaign
            Host      : {{ inventory_hostname }}
            Run Time  : {{ ansible_date_time.iso8601 }}
            Campaigns : Jun 2026 "Atomic Arch" waves 1-3 (Sonatype-2026-003775)
                        Jul-Aug 2026 account takeover / committed ELF
                        Aug-Oct 2026 scriptlet backdoors, hellscripter worm (ONGOING)
            Windows   : {% for w in ioc_windows %}{{ w.id }} {{ w.start }}..{{ w.end }}{% if not loop.last %} | {% endif %}{% endfor %}

            IOC Ref   : https://github.com/lenucksi/aur-malware-check (June only)
                        https://safedep.io/dirtyblanket-express-impersonation-npm/
            Note      : Jul-Oct detection is mostly shape-based (committed ELF,
                        scriptlet backdoor, typosquat). Hashes only for §17.
          ================================================================================
      tags: [always]

    # ── §1 AUR packages + install dates ──────────────────────────────────────
    # Parses each install date to ISO via `date -d` and compares against the
    # ioc_windows list, then caches pkg/date/window to pkgdate_cache for §6/§15/§16.
    - name: "[1] AUR packages and install dates"
      shell: |
        {
          echo ""
          echo "========================================"
          echo " [1] AUR PACKAGES + INSTALL DATES"
          echo "========================================"
          WINDOWS='{% for w in ioc_windows %}{{ w.id }},{{ w.start }},{{ w.end }},{{ w.label }};{% endfor %}'
          echo "[!] Windows checked:"
          IFS=';' read -ra WLIST <<< "$WINDOWS"
          for W in "${WLIST[@]}"; do
            [ -n "$W" ] || continue
            IFS=',' read -r WID WSTART WEND WLABEL <<< "$W"
            printf '      %-14s %s .. %s  (%s)\n' "$WID" "$WSTART" "$WEND" "$WLABEL"
          done
          echo ""
          : > "{{ pkgdate_cache }}"
          pacman -Qqm | while read -r pkg; do
            IDATE_RAW=$(pacman -Qi "$pkg" 2>/dev/null \
              | sed -n 's/^Install Date\s*:\s*//p')
            IDATE=$(date -d "$IDATE_RAW" +%Y-%m-%d 2>/dev/null || echo "unknown")
            VER=$(pacman -Qi "$pkg" 2>/dev/null | sed -n 's/^Version\s*:\s*//p')
            HIT_ID="-"
            HIT_LABEL=""
            for W in "${WLIST[@]}"; do
              [ -n "$W" ] || continue
              IFS=',' read -r WID WSTART WEND WLABEL <<< "$W"
              if [ "$IDATE" != "unknown" ] \
                 && [ ! "$IDATE" \< "$WSTART" ] && [ ! "$IDATE" \> "$WEND" ]; then
                HIT_ID="$WID"
                HIT_LABEL="$WLABEL"
                break
              fi
            done
            printf '%s\t%s\t%s\n' "$pkg" "$IDATE" "$HIT_ID" >> "{{ pkgdate_cache }}"
            if [ "$HIT_ID" != "-" ]; then
              echo "[!! IN WINDOW: ${HIT_ID} !!] ${pkg} ${VER} installed ${IDATE} — ${HIT_LABEL}"
            else
              echo "[ ok ]                ${pkg} ${VER} installed ${IDATE}"
            fi
          done
          echo ""
          if [ ! -s "{{ pkgdate_cache }}" ]; then
            echo "[info] No foreign (AUR) packages installed on this host."
          fi
          echo ""
        } >> {{ report_path }}
      args:
        executable: /bin/bash
      ignore_errors: true
      changed_when: true
      tags: [audit]

    # ── §2 Community compromised package list cross-reference ─────────────────
    # The repo moved to branch master and split its data per campaign under
    # data/campaigns.json, so the old main/packages.txt URL 404s. This reads the
    # campaign index and every list it points at, and reports whether the index
    # actually covers the currently-open window.
    - name: "[2] Cross-reference against community compromised package lists"
      shell: |
        {
          echo ""
          echo "========================================"
          echo " [2] COMMUNITY COMPROMISED PACKAGE LIST CROSS-REFERENCE"
          echo "========================================"
          echo "[!] Index: {{ campaign_index_base }}data/campaigns.json"
          echo ""
          if ! command -v python3 >/dev/null 2>&1; then
            echo "[SKIP] python3 not available — cannot parse the campaign index."
          else
            INSTALLED_PKGS="$(pacman -Qqm 2>/dev/null)" \
            BASE="{{ campaign_index_base }}" \
            OPEN_WINDOW_START="{{ ioc_windows | map(attribute='start') | max }}" \
            python3 - <<'PYEOF'
        import json, os, sys, urllib.request

        base = os.environ["BASE"]
        installed = {p.strip() for p in os.environ["INSTALLED_PKGS"].split() if p.strip()}
        open_start = os.environ["OPEN_WINDOW_START"]

        def fetch(url):
            with urllib.request.urlopen(url, timeout=20) as r:
                return r.read().decode("utf-8", "replace")

        try:
            index = json.loads(fetch(base + "data/campaigns.json"))
        except Exception as exc:
            print("[SKIP] Could not fetch campaign index: %s" % exc)
            print("       Node may have no internet access. Verify manually at:")
            print("       https://github.com/lenucksi/aur-malware-check")
            sys.exit(0)

        campaigns = index.get("campaigns", [])
        print("[info] %d campaign(s) in the community index:" % len(campaigns))
        covers_open = False
        for c in campaigns:
            win = c.get("date_window") or {}
            start, end = win.get("start", "?"), win.get("end", "?")
            print("       - %-14s %s  (%s .. %s)"
                  % (c.get("id", "?"), c.get("display", "?"), start, end))
            if end != "?" and end >= open_start:
                covers_open = True
        print("")

        if not covers_open:
            print("[WARN] No campaign in the community index covers the currently-open")
            print("       window (starts %s). Nothing after June 2026 is represented" % open_start)
            print("       in this data — §15-§19 are the only coverage for Jul-Oct.")
            print("")

        hits, checked = [], 0
        for c in campaigns:
            for rel in (c.get("lists") or []) + (c.get("npm_lists") or []):
                try:
                    body = fetch(base + rel)
                except Exception as exc:
                    print("[SKIP] %s: %s" % (rel, exc))
                    continue
                names = {n.strip() for n in body.splitlines()
                         if n.strip() and not n.strip().startswith("#")}
                checked += len(names)
                for bad in sorted(names & installed):
                    hits.append((bad, c.get("id", "?"), rel))

        print("[info] %d known-bad names checked against %d installed AUR package(s)."
              % (checked, len(installed)))
        if hits:
            for bad, cid, rel in hits:
                print("[!! MATCH !!] %s is listed in campaign '%s' (%s)" % (bad, cid, rel))
            print("[SUMMARY: FAIL — COMPROMISED PACKAGE(S) DETECTED — see above]")
        else:
            print("[SUMMARY: PASS — No installed AUR package appears in any campaign list]")
        PYEOF
          fi
          echo ""
        } >> {{ report_path }}
      args:
        executable: /bin/bash
      ignore_errors: true
      changed_when: true
      tags: [audit]

    # ── §3 PKGBUILD cache — Wave 1 IOC string scan ───────────────────────────
    # Scoped to PKGBUILD/install/.SRCINFO files only — excludes src/ to avoid
    # false positives from extracted source trees (e.g. Python 2.7.18 distutils).
    - name: "[3] PKGBUILD cache — Wave 1 IOC string scan (PKGBUILD/install files only)"
      shell: |
        {
          echo ""
          echo "========================================"
          echo " [3] PKGBUILD CACHE — WAVE 1 IOC STRING SCAN"
          echo "========================================"
          echo "[!] Patterns: malicious npm/bun package names, attacker account names,"
          echo "[!]           AUR packages named on aur-general since July, and"
          echo "[!]           hellscripter/CHAOS/hyprland-fixes payload strings."
          echo "[!] Scope: PKGBUILD, *.install, .SRCINFO files only (not source trees)"
          echo ""
          IOC_PATTERN='{{ ioc_packages }}|{{ ioc_accounts }}|{{ ioc_named_packages }}|{{ ioc_strings }}'
          FOUND=0
          for CACHE_DIR in /root/.cache/yay /root/.cache/paru /home/*/.cache/yay /home/*/.cache/paru; do
            [ -d "$CACHE_DIR" ] || continue
            echo "--- Scanning: ${CACHE_DIR} ---"
            RESULT=$(find "$CACHE_DIR" -maxdepth 2 \
              \( -name "PKGBUILD" -o -name "*.install" -o -name ".SRCINFO" \) \
              -print0 2>/dev/null \
              | xargs -0 grep -lInE "${IOC_PATTERN}" 2>/dev/null)
            if [ -n "$RESULT" ]; then
              echo "[!! MATCH FOUND !!]"
              echo "$RESULT" | while read -r f; do
                echo "  File: $f"
                grep -nE "${IOC_PATTERN}" "$f"
              done
              FOUND=1
            else
              echo "[clean — no Wave 1 IOC strings found in ${CACHE_DIR}]"
            fi
            echo ""
          done
          [ "$FOUND" -gt 0 ] \
            && echo "[SUMMARY: REVIEW] Wave 1 IOC strings detected — see above." \
            || true
        } >> {{ report_path }}
      ignore_errors: true
      changed_when: true
      tags: [audit]

    # ── §4 PKGBUILD cache — Wave 2 obfuscated shell detection ────────────────
    # Wave 2 used hex ($'\x63') and octal ($'\143') escaping to hide commands
    # from literal string grep. grep -P (PCRE) catches these patterns.
    - name: "[4] PKGBUILD cache — Wave 2 obfuscated shell detection"
      shell: |
        {
          echo ""
          echo "========================================"
          echo " [4] PKGBUILD CACHE — WAVE 2 OBFUSCATED SHELL DETECTION"
          echo "========================================"
          echo "[!] Wave 2 hid commands using hex (\\x63) and octal (\\143) escaping."
          echo "[!] e.g. \$'\\x63'"d" \"/\"'t'"m"'p' = 'cd /tmp' with each char escaped."
          echo ""
          OBFUSC_PATTERN='\\x[0-9a-fA-F]{2}|\\[0-7]{3}'
          FOUND=0
          for CACHE_DIR in /root/.cache/yay /root/.cache/paru /home/*/.cache/yay /home/*/.cache/paru; do
            [ -d "$CACHE_DIR" ] || continue
            echo "--- Scanning: ${CACHE_DIR} ---"
            RESULT=$(find "$CACHE_DIR" -maxdepth 2 \
              \( -name "PKGBUILD" -o -name "*.install" -o -name ".SRCINFO" \) \
              -print0 2>/dev/null \
              | xargs -0 grep -lInP "${OBFUSC_PATTERN}" 2>/dev/null)
            if [ -n "$RESULT" ]; then
              echo "[!! POTENTIAL MATCH !!] (manual review required — may be legitimate)"
              echo "$RESULT" | while read -r f; do
                echo "  File: $f"
                grep -nP "${OBFUSC_PATTERN}" "$f"
              done
              FOUND=1
            else
              echo "[clean — no Wave 2 obfuscation patterns found in ${CACHE_DIR}]"
            fi
            echo ""
          done
          [ "$FOUND" -gt 0 ] \
            && echo "[SUMMARY: REVIEW] Possible Wave 2 obfuscation detected — manual PKGBUILD review needed." \
            || true
        } >> {{ report_path }}
      ignore_errors: true
      changed_when: true
      tags: [audit]

    # ── §5 PKGBUILD cache — suspicious install hooks and JS runtimes ──────────
    - name: "[5] PKGBUILD cache — suspicious install hooks and JS runtimes"
      shell: |
        {
          echo ""
          echo "========================================"
          echo " [5] PKGBUILD CACHE — SUSPICIOUS HOOKS AND JS RUNTIME INVOCATIONS"
          echo "========================================"
          echo "[!] Flagging: npm install/ci, bun add/install/x, yarn add, pnpm add,"
          echo "[!]           curl/wget piped into a shell or node (hellscripter loader:"
          echo "[!]           bash <(curl ...linux.sh)), web.archive.org fetches, and"
          echo "[!]           sudo inside PKGBUILD/.install (gentor/hyprland-fixes"
          echo "[!]           escaped fakeroot that way)."
          echo "[!] Scope: PKGBUILD, *.install, .SRCINFO files only"
          echo "[!] Jul-Aug wave note: plex-media-player was hit via npm install in an"
          echo "[!] orphaned package, so this check still applies to that wave."
          echo ""
          HOOK_PATTERN='npm (install|ci)|bun (add|install|x)|yarn add|pnpm add|npx |bunx |(curl|wget)[^|]*\|[[:space:]]*(sudo +)?(ba|z|da)?sh|(curl|wget)[^|]*\|[[:space:]]*node|<\((curl|wget)|web\.archive\.org/web/|(^|[[:space:];&|(])sudo '
          FOUND=0
          for CACHE_DIR in /root/.cache/yay /root/.cache/paru /home/*/.cache/yay /home/*/.cache/paru; do
            [ -d "$CACHE_DIR" ] || continue
            echo "--- ${CACHE_DIR} ---"
            RESULT=$(find "$CACHE_DIR" -maxdepth 2 \
              \( -name "PKGBUILD" -o -name "*.install" -o -name ".SRCINFO" \) \
              -print0 2>/dev/null \
              | xargs -0 grep -lInE "${HOOK_PATTERN}" 2>/dev/null)
            if [ -n "$RESULT" ]; then
              echo "[!! JS RUNTIME / REMOTE-SCRIPT / SUDO INVOCATION FOUND !!]"
              echo "$RESULT" | while read -r f; do
                echo "  File: $f"
                grep -nE "${HOOK_PATTERN}" "$f"
              done
              FOUND=1
            else
              echo "[clean — no JS runtime invocations found in ${CACHE_DIR}]"
            fi
            echo ""
          done
          [ "$FOUND" -gt 0 ] \
            && echo "[SUMMARY: REVIEW] JS runtime invocations detected in PKGBUILD cache." \
            || true
        } >> {{ report_path }}
      ignore_errors: true
      changed_when: true
      tags: [audit]

    # ── §6 Critical-window PKGBUILD content dump ─────────────────────────────
    - name: "[6] Critical-window packages — cached PKGBUILD content dump"
      shell: |
        {
          echo ""
          echo "========================================"
          echo " [6] CRITICAL-WINDOW PACKAGES — CACHED PKGBUILD DUMP"
          echo "========================================"
          echo "[!] Dumps the cached PKGBUILD for any package installed inside a window."
          echo "[!] Absent PKGBUILD = cache was cleaned after install."
          echo ""
          if [ ! -f "{{ pkgdate_cache }}" ]; then
            echo "[SKIP] {{ pkgdate_cache }} missing — run §1 first."
          else
            ANY=0
            while IFS=$'\t' read -r PKG IDATE WID; do
              [ "$WID" = "-" ] && continue
              ANY=1
              echo ""
              echo "  Package  : $PKG"
              echo "  Installed: $IDATE  (window: $WID)"
              PKG_FOUND=0
              for CACHE_DIR in /root/.cache/yay /root/.cache/paru \
                               /home/*/.cache/yay /home/*/.cache/paru; do
                PBFILE="${CACHE_DIR}/${PKG}/PKGBUILD"
                if [ -f "$PBFILE" ]; then
                  PKG_FOUND=1
                  echo "  Source   : ${PBFILE}"
                  echo "  --- BEGIN PKGBUILD ---"
                  cat "$PBFILE"
                  echo "  --- END PKGBUILD ---"
                fi
              done
              [ $PKG_FOUND -eq 0 ] && echo "  [PKGBUILD not in cache — verify at https://aur.archlinux.org/packages/${PKG}]"
            done < "{{ pkgdate_cache }}"
            [ $ANY -eq 0 ] && echo "  [No packages fall within any campaign window]"
          fi
          echo ""
        } >> {{ report_path }}
      args:
        executable: /bin/bash
      ignore_errors: true
      changed_when: true
      tags: [audit]

