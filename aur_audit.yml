    # ── §11 Dropper binary search ─────────────────────────────────────────────
    # Uses variable capture (not && echo) so exit code reflects find errors,
    # not whether results were found (find exits 0 either way).
    # Broadened past the literal name 'deps': the Jul-Aug wave names its payload
    # after ordinary build helpers, and June also dropped a sudo password grabber.
    - name: "[11] Dropper binary search (deps + Jul-Aug payload names + sudo grabber)"
      shell: |
        {
          echo ""
          echo "========================================"
          echo " [11] DROPPER BINARY SEARCH"
          echo "========================================"
          echo "[!] June wave : Rust ELF64 'deps' dropped by atomic-lockfile preinstall."
          echo "[!] Jul-Aug   : ELF named {{ ioc_payload_names }}."
          echo "[!] June wave : sudo password grabber at ~/.local/bin/sudo"
          echo "[!]             sha256 {{ ioc_sudo_grabber_sha256 }}"
          echo ""
          NAME_ARGS=( -name "deps" )
          IFS='|' read -ra PAYLOAD_NAMES <<< "{{ ioc_payload_names }}"
          for N in "${PAYLOAD_NAMES[@]}"; do
            NAME_ARGS+=( -o -name "$N" )
          done
          echo "--- /tmp, /var/tmp, /run ---"
          HITS=$(find /tmp /var/tmp /run -type f \( "${NAME_ARGS[@]}" \) 2>/dev/null)
          if [ -n "$HITS" ]; then
            echo "[!! FOUND — treat as compromised !!]"
            echo "$HITS" | while read -r f; do
              echo "  $f  ($(stat -c%s "$f" 2>/dev/null) bytes)"
            done
          else
            echo "[not found]"
          fi
          echo ""
          echo "--- /root and /home (excluding build caches) ---"
          HITS=$(find /root /home -type f \( "${NAME_ARGS[@]}" \) \
            ! -path "*/.cache/yay/*" ! -path "*/.cache/paru/*" 2>/dev/null)
          if [ -n "$HITS" ]; then
            echo "[!! FOUND — treat as compromised !!]"
            echo "$HITS" | while read -r f; do
              echo "  $f  ($(stat -c%s "$f" 2>/dev/null) bytes)"
            done
          else
            echo "[not found]"
          fi
          echo ""
          echo "--- sudo password grabber (~/.local/bin/sudo) ---"
          GRABBER=0
          for UHOME in /root /home/*; do
            SUDOBIN="${UHOME}/.local/bin/sudo"
            [ -f "$SUDOBIN" ] || continue
            GRABBER=1
            SUM=$(sha256sum "$SUDOBIN" 2>/dev/null | awk '{print $1}')
            if [ "$SUM" = "{{ ioc_sudo_grabber_sha256 }}" ]; then
              echo "[!! SUDO GRABBER — exact hash match, treat as compromised !!] $SUDOBIN"
            else
              echo "[!! FOUND — a user-writable 'sudo' shadowing the real one is suspicious !!]"
              echo "  $SUDOBIN  sha256 $SUM  (does not match the known June hash)"
            fi
          done
          [ $GRABBER -eq 0 ] && echo "[not found]"
          echo ""
        } >> {{ report_path }}
      args:
        executable: /bin/bash
      ignore_errors: true
      changed_when: true
      tags: [audit]

    # ── §12 Active network connections ────────────────────────────────────────
    - name: "[12] Active network connections, Tor indicators and listeners"
      shell: |
        {
          echo ""
          echo "========================================"
          echo " [12] NETWORK — CONNECTIONS, TOR INDICATORS, LISTENERS"
          echo "========================================"
          echo "[!] Expected on k3s nodes: :6443 (API server), :10250 (kubelet), SSH."
          echo "[!] Tor is a strong IOC — the Jul-Aug wave's org-cli payload was a Tor"
          echo "[!] backdoor, and the dropper analysis flagged odd localhost ports."
          echo ""
          echo "--- established non-loopback connections ---"
          ss -tnp 2>/dev/null | grep -v '127\.0\.0\.\|::1' \
            || echo "[no non-loopback connections or ss unavailable]"
          echo ""
          echo "--- Tor port check ({{ tor_ports }}) ---"
          TORCONN=$(ss -tnp 2>/dev/null | grep -E ':({{ tor_ports }})[[:space:]]|:({{ tor_ports }})$')
          if [ -n "$TORCONN" ]; then
            echo "[!! TOR CONNECTION — treat as compromised !!]"
            echo "$TORCONN"
          else
            echo "[clean — no connections on known Tor ports]"
          fi
          echo ""
          echo "--- Tor binaries / units present ---"
          TORBIN=""
          for T in tor torsocks tor-browser obfs4proxy snowflake-client; do
            P=$(command -v "$T" 2>/dev/null)
            [ -n "$P" ] && TORBIN="${TORBIN}  ${T} -> ${P}"$'\n'
          done
          TORUNIT=$(systemctl list-unit-files 2>/dev/null | grep -iE '^tor(@|\.|-)' || true)
          if [ -n "$TORBIN" ] || [ -n "$TORUNIT" ]; then
            echo "[!! TOR SOFTWARE PRESENT — not expected on a k3s node !!]"
            [ -n "$TORBIN" ] && printf '%s' "$TORBIN"
            [ -n "$TORUNIT" ] && echo "$TORUNIT"
          else
            echo "[clean — no Tor binaries or units found]"
          fi
          echo ""
          echo "--- all listeners (full context, review by hand) ---"
          ss -tlnp 2>/dev/null || echo "[ss unavailable]"
          echo ""
          echo "--- loopback listeners outside the expected k3s/system set ---"
          echo "[!] Review-level, not proof: an unexplained localhost listener is how the"
          echo "[!] dropper's local control channel showed up in the published analysis."
          UNEXPECTED=$(ss -tlnp 2>/dev/null \
            | awk 'NR>1 && ($4 ~ /^127\.0\.0\.1:/ || $4 ~ /^\[::1\]:/)' \
            | grep -vE ':({{ expected_listener_ports }})[[:space:]]' \
            | grep -vE '"({{ expected_listener_procs }})"' \
            || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "[review] Loopback listener(s) not in the expected set:"
            echo "$UNEXPECTED"
            echo "[SUMMARY: REVIEW] Unexplained loopback listener — confirm the owning process."
          else
            echo "[clean — no unexpected loopback listeners]"
          fi
          echo ""
        } >> {{ report_path }}
      args:
        executable: /bin/bash
      ignore_errors: true
      changed_when: true
      tags: [audit]

    # ── §13 Unexpected JS runtime presence ───────────────────────────────────
    - name: "[13] Unexpected JS runtime presence (node, bun, npm)"
      shell: |
        {
          echo ""
          echo "========================================"
          echo " [13] UNEXPECTED RUNTIME PRESENCE (node, npm, bun, yarn, pnpm)"
          echo "========================================"
          echo "[!] None of these should be present on a k3s node."
          echo "[!] Strong IOC for the June waves — those cannot execute without one."
          echo "[!] NOT a gate for the Jul-Aug wave: its payload is a committed ELF and"
          echo "[!] needs no JS runtime. Absence here does not clear that wave — see §15."
          echo ""
          FOUND_RT=0
          for CMD in node npm bun npx yarn pnpm; do
            PATH_RESULT=$(command -v "$CMD" 2>/dev/null)
            if [ -n "$PATH_RESULT" ]; then
              VERSION=$("$CMD" --version 2>/dev/null || echo "unknown")
              echo "[!! FOUND !!] ${CMD} -> ${PATH_RESULT}  (${VERSION})"
              FOUND_RT=1
            else
              echo "[absent]      ${CMD}"
            fi
          done
          echo ""
          if [ $FOUND_RT -eq 0 ]; then
            echo "[SUMMARY: PASS — No JS runtimes present]"
          else
            echo "[SUMMARY: REVIEW — JS runtime(s) found — verify they are intentional]"
          fi
          echo ""
        } >> {{ report_path }}
      ignore_errors: true
      changed_when: true
      tags: [audit]

    # ── §14 Shell config injection — Wave 3 Russian spam ─────────────────────
    # Wave 3 (Jun 14-15): attackers injected Cyrillic messages into ~/.bashrc,
    # ~/.zshrc, ~/.config/fish/config.fish via post_install hooks in 70+ packages
    # (mostly Python/Ruby ecosystem and llama.cpp). Pure vandalism, no infostealer.
    - name: "[14] Shell config injection — Wave 3 Russian spam (June 2026)"
      shell: |
        {
          echo ""
          echo "========================================"
          echo " [14] SHELL CONFIG INJECTION — WAVE 3 RUSSIAN SPAM"
          echo "========================================"
          echo "[!] Wave 3 injected Cyrillic text into shell configs via post_install hooks."
          echo "[!] Affected: ~70+ packages, mostly Python/Ruby/llama.cpp ecosystem."
          echo "[!] Scope: ~/.bashrc, ~/.zshrc, ~/.bash_profile, ~/.profile, fish config."
          echo ""
          FOUND=0
          for UHOME in /root /home/*; do
            [ -d "$UHOME" ] || continue
            UNAME=$(basename "$UHOME")
            for SHELLRC in \
              "${UHOME}/.bashrc" \
              "${UHOME}/.zshrc" \
              "${UHOME}/.bash_profile" \
              "${UHOME}/.profile" \
              "${UHOME}/.config/fish/config.fish"; do
              [ -f "$SHELLRC" ] || continue
              echo "--- Checking: ${SHELLRC} ---"
              # Check for Cyrillic characters (Unicode block U+0400-U+04FF)
              if LC_ALL=C grep -qP "\x{0400}" "$SHELLRC" 2>/dev/null \
                || LC_ALL=C grep -qP "[\xd0-\xd3][\x80-\xbf]" "$SHELLRC" 2>/dev/null; then
                echo "[!! CYRILLIC TEXT DETECTED !!]"
                grep -n "." "$SHELLRC" | LC_ALL=C grep -P "[\xd0-\xd3][\x80-\xbf]"
                FOUND=1
              fi
              # Check if file was modified after the attack window opened
              if find "$SHELLRC" -newermt "{{ critical_date }}" 2>/dev/null | grep -q .; then
                echo "[MODIFIED after {{ critical_date }}]"
                INJECTIONS=$(grep -nE \
                  'curl [^|]|wget [^|]|base64 |eval \$|echo.*https?://|\$\(curl|\$\(wget' \
                  "$SHELLRC" 2>/dev/null)
                if [ -n "$INJECTIONS" ]; then
                  echo "[!! SUSPICIOUS INJECTION PATTERNS !!]"
                  echo "$INJECTIONS"
                  FOUND=1
                else
                  echo "  [modified but no suspicious download/eval patterns found]"
                fi
              else
                echo "  [not modified since {{ critical_date }}]"
              fi
              echo ""
            done
          done
          echo "--- /etc/profile.d/ scripts modified after {{ critical_date }} ---"
          PROFILED=$(find /etc/profile.d/ -newermt "{{ critical_date }}" -type f 2>/dev/null | sort)
          if [ -n "$PROFILED" ]; then
            echo "$PROFILED"
            echo "$PROFILED" | while read -r f; do
              SUSPICIOUS=$(LC_ALL=C grep -nP "[\xd0-\xd3][\x80-\xbf]|curl |wget |base64 |eval " "$f" 2>/dev/null)
              [ -n "$SUSPICIOUS" ] && echo "  [SUSPICIOUS] $f:" && echo "$SUSPICIOUS" && FOUND=1
            done
          else
            echo "[none found]"
          fi
          echo ""
          if [ $FOUND -eq 0 ]; then
            echo "[SUMMARY: PASS — No shell config injection detected]"
          else
            echo "[SUMMARY: REVIEW — Shell config injection detected — review above]"
          fi
          echo ""
        } >> {{ report_path }}
      ignore_errors: true
      changed_when: true
      tags: [audit]

    # ── §15 Committed ELF in the AUR git tree — Jul-Aug 2026 wave ────────────
    # The July-August wave commits a precompiled ELF into the package's own AUR
    # git repo and calls it from build(). §3/§4/§5 cannot see it: they only read
    # PKGBUILD/*.install/.SRCINFO, and the payload is a binary blob elsewhere in
    # the tree.
    #
    # Discriminator: yay/paru cache dirs ARE git clones of the AUR repo, so an
    # attacker-committed blob is TRACKED BY GIT while ordinary build output is
    # not. Scanning for "any ELF under the cache" is useless — python2's own
    # build tree alone yields 20+ .o files per node. `git ls-files` is precise.
    - name: "[15] Committed ELF / suspicious blobs in AUR git trees (Jul-Aug 2026 wave)"
      shell: |
        {
          echo ""
          echo "========================================"
          echo " [15] COMMITTED ELF IN AUR GIT TREE (JUL-AUG 2026 WAVE)"
          echo "========================================"
          echo "[!] Only git-TRACKED files are considered: a tracked ELF was committed by"
          echo "[!] whoever controls the AUR repo. Untracked ELFs are ordinary build output."
          echo "[!] Also checks commit metadata: authors spoofed as github-actions[bot],"
          echo "[!] the subject 'Add missing deps', and known attacker accounts."
          echo ""
          if ! command -v git >/dev/null 2>&1; then
            echo "[SKIP] git not installed — cannot inspect AUR git trees."
          else
            FOUND=0
            REVIEW=0
            SCANNED=0
            for CACHE_DIR in /root/.cache/yay /root/.cache/paru /home/*/.cache/yay /home/*/.cache/paru; do
              [ -d "$CACHE_DIR" ] || continue
              echo "--- ${CACHE_DIR} ---"
              for PKG_DIR in "${CACHE_DIR}"/*/; do
                [ -d "$PKG_DIR" ] || continue
                PKG=$(basename "$PKG_DIR")
                if [ ! -e "${PKG_DIR}.git" ]; then
                  echo "  [no git tree] ${PKG} — cannot verify what was committed"
                  REVIEW=1
                  continue
                fi
                SCANNED=$((SCANNED+1))
                TRACKED=$(git -C "$PKG_DIR" ls-files 2>/dev/null)
                while IFS= read -r REL; do
                  [ -n "$REL" ] || continue
                  F="${PKG_DIR}${REL}"
                  [ -f "$F" ] || continue
                  MAGIC=$(head -c4 "$F" 2>/dev/null | od -An -tx1 | tr -d ' \n')
                  BASE=$(basename "$REL")
                  if [ "$MAGIC" = "7f454c46" ]; then
                    SUM=$(sha256sum "$F" 2>/dev/null | awk '{print $1}')
                    KNOWN=$(printf '%s' "{{ ioc_sha256_table }}" | awk -v s="$SUM" '$1 == s { $1 = ""; print substr($0, 2) }')
                    echo "  [!! COMMITTED ELF IN AUR GIT TREE !!] ${PKG}: ${REL} ($(stat -c%s "$F" 2>/dev/null) bytes)"
                    echo "      sha256 ${SUM}${KNOWN:+  == KNOWN: $KNOWN}"
                    git -C "$PKG_DIR" log -1 \
                      --format='      commit %H%n      author %an <%ae>%n      date   %aI%n      subject %s' \
                      -- "$REL" 2>/dev/null
                    FOUND=1
                  elif echo "$BASE" | grep -qxE '{{ ioc_payload_names }}'; then
                    echo "  [review] ${PKG}: tracked file '${REL}' matches Jul-Aug payload naming (not an ELF)"
                    REVIEW=1
                  fi
                done <<TRACKEDEOF
        $TRACKED
        TRACKEDEOF
                SPOOF=$(git -C "$PKG_DIR" log --all \
                  --format='      %H | %an <%ae> | %aI | %s' 2>/dev/null \
                  | grep -E '{{ ioc_commit_markers }}|{{ ioc_accounts }}' || true)
                if [ -n "$SPOOF" ]; then
                  echo "  [!! SPOOFED / ATTACKER COMMIT METADATA !!] ${PKG}"
                  echo "$SPOOF"
                  FOUND=1
                fi
              done
              echo ""
            done
            echo "[info] ${SCANNED} AUR git tree(s) inspected."
            if [ $FOUND -gt 0 ]; then
              echo "[SUMMARY: FAIL — committed binary or attacker commit metadata found]"
            elif [ $REVIEW -gt 0 ]; then
              echo "[SUMMARY: REVIEW — see [review] lines above]"
            else
              echo "[SUMMARY: PASS — no committed ELF or suspicious commit metadata]"
            fi
          fi
          echo ""
        } >> {{ report_path }}
      args:
        executable: /bin/bash
      ignore_errors: true
      changed_when: true
      tags: [audit]

    # ── §16 AUR maintainer / adoption state — Jul-Aug 2026 wave ──────────────
    # Entry vector for this wave was the AUR account layer, not the PKGBUILD:
    # attackers adopted orphaned packages or took over existing accounts, then
    # pushed. So the maintainer field and last-modified time are the IOCs.
    # Arch disabled adoption 2026-07-30 and pushes 2026-08-01.
    - name: "[16] AUR maintainer / adoption state for installed foreign packages"
      shell: |
        {
          echo ""
          echo "========================================"
          echo " [16] AUR MAINTAINER / ADOPTION STATE"
          echo "========================================"
          echo "[!] Flags: orphaned (adoption target), maintainer is a known attacker"
          echo "[!]        account, package modified inside an open campaign window,"
          echo "[!]        or package no longer exists in the AUR (possibly removed"
          echo "[!]        for malware while still installed here)."
          echo ""
          if ! command -v python3 >/dev/null 2>&1; then
            echo "[SKIP] python3 not available — cannot query the AUR RPC."
          else
            INSTALLED_PKGS="$(pacman -Qqm 2>/dev/null)" \
            RPC_URL="{{ aur_rpc_url }}" \
            BAD_ACCOUNTS="{{ ioc_accounts_list | join(',') }}" \
            NAMED_JUL="{{ ioc_named_packages_list | join(',') }}" \
            WINDOWS="{% for w in ioc_windows %}{{ w.id }},{{ w.start }},{{ w.end }};{% endfor %}" \
            python3 - <<'PYEOF'
        import json, os, sys, urllib.parse, urllib.request
        from datetime import datetime, timezone

        installed = sorted({p.strip() for p in os.environ["INSTALLED_PKGS"].split() if p.strip()})
        if not installed:
            print("[info] No foreign (AUR) packages installed — nothing to check.")
            sys.exit(0)

        bad = {a.strip() for a in os.environ["BAD_ACCOUNTS"].split(",") if a.strip()}
        named = {n.strip() for n in os.environ["NAMED_JUL"].split(",") if n.strip()}
        windows = []
        for chunk in os.environ["WINDOWS"].split(";"):
            if chunk.strip():
                wid, start, end = chunk.split(",")
                windows.append((wid, start, end))

        def aur_name(pkg):
            # makepkg debug split packages (foo-debug) are built locally and never
            # exist in the AUR on their own — their provenance is the base package.
            # Looking them up directly returns "not found" for every single one.
            return pkg[:-6] if pkg.endswith("-debug") else pkg

        lookups = sorted({aur_name(p) for p in installed})
        query = urllib.parse.urlencode([("arg[]", p) for p in lookups])
        try:
            with urllib.request.urlopen(os.environ["RPC_URL"] + "?" + query, timeout=25) as r:
                payload = json.loads(r.read().decode("utf-8", "replace"))
        except Exception as exc:
            print("[SKIP] Could not reach the AUR RPC: %s" % exc)
            print("       Node may have no internet access. Check by hand at")
            print("       https://aur.archlinux.org/packages/<name>")
            sys.exit(0)

        results = {e.get("Name"): e for e in payload.get("results", [])}
        fail = review = 0

        for pkg in installed:
            look = aur_name(pkg)
            label = pkg if look == pkg else "%s (debug split of %s)" % (pkg, look)
            entry = results.get(look)
            if entry is None:
                print("[review] %-32s NOT FOUND in the AUR — deleted or renamed upstream." % label)
                print("         A package removed for malware still shows as installed here.")
                review = 1
                continue

            maint = entry.get("Maintainer")
            last = entry.get("LastModified")
            when = "unknown"
            if isinstance(last, int):
                when = datetime.fromtimestamp(last, timezone.utc).strftime("%Y-%m-%d")

            flags = []
            if maint in bad:
                flags.append("!! KNOWN-BAD MAINTAINER: %s" % maint)
                fail = 1
            if not maint:
                flags.append("ORPHANED — adoption target for the Jul-Aug wave")
                review = 1
            if look in named or entry.get("PackageBase") in named:
                flags.append("named on aur-general as malicious (Jul-Oct 2026)")
                fail = 1
            for wid, start, end in windows:
                if when != "unknown" and start <= when <= end:
                    flags.append("last pushed %s — inside window %s" % (when, wid))
                    review = 1
            if entry.get("OutOfDate"):
                flags.append("flagged out-of-date upstream")

            if flags:
                marker = "[!!]" if any(f.startswith("!!") or "named on" in f for f in flags) else "[review]"
                print("%s %-32s maintainer=%s last=%s" % (marker, label, maint or "(orphaned)", when))
                for f in flags:
                    print("        - %s" % f.lstrip("! "))
            else:
                print("[ ok ]   %-32s maintainer=%s last=%s" % (label, maint, when))

        print("")
        if fail:
            print("[SUMMARY: FAIL — attacker-controlled or wave-named package installed]")
        elif review:
            print("[SUMMARY: REVIEW — orphaned / recently-pushed / missing packages above]")
        else:
            print("[SUMMARY: PASS — every installed AUR package has a maintainer and no window hits]")
        PYEOF
          fi
          echo ""
        } >> {{ report_path }}
      args:
        executable: /bin/bash
      ignore_errors: true
      changed_when: true
      tags: [audit]

    # ── §17 hellscripter worm / CHAOS RAT — Sep-Oct 2026 ─────────────────────
    # linux.sh installs a Go CHAOS RAT build disguised as a systemd font service
    # and makes it immutable. Paths/names are fixed and hashes are published, so
    # this is the one Aug-Oct check that is IOC-exact rather than shape-based.
    - name: "[17] hellscripter worm / CHAOS RAT artifacts (Sep-Oct 2026)"
      shell: |
        {
          echo ""
          echo "========================================"
          echo " [17] HELLSCRIPTER WORM / CHAOS RAT (SEP-OCT 2026)"
          echo "========================================"
          echo "[!] Root : /usr/lib/systemd/systemd-fontrenderd + systemd-fontrenderd.service"
          echo "[!] User : ~/.config/systemd/systemd-fontcached, ~/.config/systemd/systemd-fontrenderd/"
          echo "[!] C2   : CHAOS RAT over Tor (bundled Tor Expert Bundle, socks5 127.0.0.1:9050)"
          echo ""
          FOUND=0
          echo "--- systemd-font* files, units and dirs ---"
          HITS=$(find /usr/lib/systemd /etc/systemd /root/.config/systemd /home/*/.config/systemd \
            -maxdepth 3 -name 'systemd-font*' 2>/dev/null | sort)
          if [ -n "$HITS" ]; then
            echo "[!! FOUND — CHAOS RAT persistence, treat as compromised !!]"
            echo "$HITS" | while read -r f; do echo "  $(ls -ld "$f" 2>/dev/null)"; done
            FOUND=1
          else
            echo "[not found]"
          fi
          echo ""
          echo "--- running processes ---"
          # Match comm (process name), not args: the command line of this task
          # contains the string, so `pgrep -f` always matches itself.
          PROCS=$(ps -eo pid=,comm=,args= 2>/dev/null | awk '$2 ~ /^systemd-font/' || true)
          if [ -n "$PROCS" ]; then
            echo "[!! FOUND — CHAOS RAT process running !!]"
            echo "$PROCS"
            FOUND=1
          else
            echo "[not running]"
          fi
          echo ""
          echo "--- immutable (chattr +i) files under systemd dirs ---"
          echo "[!] Nothing pacman installs is immutable; the worm sets +i so its units"
          echo "[!] survive 'rm'. Clear with chattr -i from a trusted shell before removal."
          IMMUT=$(lsattr -R /etc/systemd /usr/lib/systemd 2>/dev/null | awk '$1 ~ /i/ {print $2}')
          if [ -n "$IMMUT" ]; then
            echo "[!! FOUND — immutable systemd files !!]"
            echo "$IMMUT"
            FOUND=1
          else
            echo "[none]"
          fi
          echo ""
          echo "--- worm log (/tmp/log on SSH-reached hosts) ---"
          if [ -f /tmp/log ] && grep -qE 'hellscripter|linux\.sh|systemd-font' /tmp/log 2>/dev/null; then
            echo "[!! FOUND — /tmp/log references the worm, this host was reached over SSH !!]"
            head -20 /tmp/log
            FOUND=1
          else
            echo "[not found]"
          fi
          echo ""
          echo "--- known payload hash sweep (user systemd dirs, /tmp, /var/tmp, ~/.local/bin) ---"
          HASHHIT=$(find /root/.config/systemd /home/*/.config/systemd /tmp /var/tmp \
              /root/.local/bin /home/*/.local/bin -xdev -type f -size -20M 2>/dev/null \
            | xargs -r sha256sum 2>/dev/null \
            | awk 'NR == FNR { lbl = $0; sub(/^[^ ]+ /, "", lbl); bad[$1] = lbl; next }
                   ($1 in bad) { print "  " $2 "  == " bad[$1] }' \
              <(printf '%s' "{{ ioc_sha256_table }}") - )
          if [ -n "$HASHHIT" ]; then
            echo "[!! FOUND — exact payload hash match !!]"
            echo "$HASHHIT"
            FOUND=1
          else
            echo "[no matches]"
          fi
          echo ""
          echo "--- blast radius if this node WERE infected (informational) ---"
          echo "[!] The worm reuses every private key here against every host in"
          echo "[!] known_hosts, and pushes its loader to any AUR package a key can push."
          for UHOME in /root /home/*; do
            for K in "$UHOME"/.ssh/id_*; do
              [ -f "$K" ] || continue
              case "$K" in *.pub) continue ;; esac
              echo "  [info] private key: $K"
            done
            KH="$UHOME/.ssh/known_hosts"
            [ -f "$KH" ] && echo "  [info] $KH: $(grep -c . "$KH") host entries"
            grep -qs 'aur.archlinux.org' "$UHOME/.ssh/config" "$KH" \
              && echo "  [info] $UHOME has AUR push config/known_hosts — worm could push to your AUR packages"
            [ -f "$UHOME/.npmrc" ] && grep -qs '_authToken' "$UHOME/.npmrc" \
              && echo "  [info] $UHOME/.npmrc holds an npm publish token"
          done
          echo ""
          if [ $FOUND -eq 0 ]; then
            echo "[SUMMARY: PASS — no hellscripter / CHAOS RAT artifacts]"
          else
            echo "[SUMMARY: FAIL — hellscripter / CHAOS RAT artifacts present]"
          fi
          echo ""
        } >> {{ report_path }}
      args:
        executable: /bin/bash
      ignore_errors: true
      changed_when: true
      tags: [audit]

    # ── §18 Install-scriptlet backdoor shape — Aug-Sep 2026 ──────────────────
    # x11-qemu-validation and hyprland-fixes didn't drop a named binary — they
    # reconfigured the box: extra sudo users, attacker ssh keys, extra sshd
    # listeners, Tailscale, SUID-root helpers, log wipes. So check the state those
    # leave behind, independent of which package did it.
    - name: "[18] Install-scriptlet backdoor state (users, keys, sshd, SUID, overlay VPN)"
      shell: |
        {
          echo ""
          echo "========================================"
          echo " [18] INSTALL-SCRIPTLET BACKDOOR STATE"
          echo "========================================"
          FOUND=0
          REVIEW=0
          echo "--- UID 0 accounts other than root ---"
          UID0=$(awk -F: '$3 == 0 && $1 != "root" {print $1}' /etc/passwd)
          if [ -n "$UID0" ]; then
            echo "[!! FOUND — extra UID 0 account(s): $UID0 !!]"; FOUND=1
          else
            echo "[none]"
          fi
          echo ""
          echo "--- interactive accounts (expected: {{ expected_login_users }}) ---"
          awk -F: '$3 >= 1000 && $3 < 60000 {print $1, $3, $6, $7}' /etc/passwd | while read -r U ID H SH; do
            if echo " {{ expected_login_users }} " | grep -q " $U "; then
              echo "  [ ok ]   $U uid=$ID shell=$SH"
            else
              echo "  [review] $U uid=$ID home=$H shell=$SH — not an expected account"
            fi
          done
          UNEXP=$(awk -F: '$3 >= 1000 && $3 < 60000 {print $1}' /etc/passwd \
            | grep -vxE "$(echo '{{ expected_login_users }}' | tr ' ' '|')" || true)
          [ -n "$UNEXP" ] && REVIEW=1
          echo "  wheel members: $(getent group wheel | cut -d: -f4)"
          echo ""
          echo "--- sudoers: NOPASSWD rules and drop-ins modified after {{ critical_date }} ---"
          grep -hE '^[^#].*NOPASSWD' /etc/sudoers /etc/sudoers.d/* 2>/dev/null | sed 's/^/  /' || true
          NEWSUDO=$(find /etc/sudoers /etc/sudoers.d -newermt "{{ critical_date }}" -type f 2>/dev/null)
          if [ -n "$NEWSUDO" ]; then
            echo "[review] modified after {{ critical_date }}:"; echo "$NEWSUDO"; REVIEW=1
          fi
          echo ""
          echo "--- authorized_keys ---"
          for UHOME in /root /home/*; do
            AK="$UHOME/.ssh/authorized_keys"
            [ -f "$AK" ] || continue
            echo "  $AK ($(grep -cvE '^(#|$)' "$AK") keys, mtime $(date -r "$AK" +%Y-%m-%d))"
            grep -vE '^(#|$)' "$AK" | awk '{print "      " $1 " ..." substr($2, length($2)-11) " " $3}'
            if find "$AK" -newermt "{{ critical_date }}" | grep -q .; then
              echo "  [review] $AK modified after {{ critical_date }} — confirm every key above is yours"
              REVIEW=1
            fi
          done
          echo ""
          echo "--- sshd listeners off port 22 (hyprland-fixes: 3333/4444) ---"
          SSHD=$(ss -tlnpH 2>/dev/null | grep '"sshd' | awk '{print $4}' | grep -vE ':22$' || true)
          if echo "$SSHD" | grep -qE ':(3333|4444)$'; then
            echo "[!! FOUND — sshd on hyprland-fixes backdoor port !!]"; echo "$SSHD"; FOUND=1
          elif [ -n "$SSHD" ]; then
            echo "[review] sshd listening on: $SSHD"; REVIEW=1
          else
            echo "[none]"
          fi
          echo ""
          echo "--- overlay VPN (Tailscale) ---"
          TS=""
          for T in tailscale tailscaled; do command -v "$T" >/dev/null 2>&1 && TS="$TS $T"; done
          systemctl is-enabled tailscaled >/dev/null 2>&1 && TS="$TS tailscaled.service(enabled)"
          ip -4 -o addr 2>/dev/null | grep -qE ' 100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.' && TS="$TS CGNAT-100.64/10-address"
          if [ -n "$TS" ]; then
            echo "[review] Tailscale present:$TS — not expected on a k3s node"; REVIEW=1
          else
            echo "[none]"
          fi
          if { iptables-save 2>/dev/null; nft list ruleset 2>/dev/null; } | grep -q '100\.70\.123\.108'; then
            echo "[!! FOUND — firewall rule for the hyprland-fixes Tailscale peer 100.70.123.108 !!]"; FOUND=1
          fi
          echo ""
          echo "--- SUID-root files not owned by any package ---"
          PRUNE=()
          for P in {{ suid_prune_paths }}; do PRUNE+=( -path "$P" -prune -o ); done
          SUIDS=$(find / -xdev "${PRUNE[@]}" -type f -perm -4000 -print 2>/dev/null)
          UNOWNED=""
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            pacman -Qqo "$f" >/dev/null 2>&1 || UNOWNED="${UNOWNED}  ${f} ($(stat -c '%U %y' "$f" | cut -d. -f1))"$'\n'
          done <<< "$SUIDS"
          echo "[info] $(printf '%s' "$SUIDS" | grep -c .) SUID file(s) checked against the pacman database."
          if [ -n "$UNOWNED" ]; then
            echo "[!! FOUND — unowned SUID binaries, treat as compromised !!]"; printf '%s' "$UNOWNED"; FOUND=1
          else
            echo "[none — every SUID binary belongs to a package]"
          fi
          echo ""
          echo "--- unowned files in /etc/pacman.d (hyprland-fixes hid configs here) ---"
          PD=""
          for f in /etc/pacman.d/*; do
            [ -f "$f" ] || continue
            case "$f" in *.pacnew|*.pacsave|*.bak) continue ;; esac
            pacman -Qqo "$f" >/dev/null 2>&1 || PD="$PD $f"
          done
          if [ -n "$PD" ]; then
            echo "[review] not owned by a package:$PD"; REVIEW=1
          else
            echo "[none]"
          fi
          echo ""
          echo "--- log / history tampering (hyprland-fixes vacuums the journal) ---"
          echo "  [info] journal starts: $(journalctl -q --no-pager -o short-iso 2>/dev/null | head -1 | cut -d' ' -f1)"
          for UHOME in /root /home/*; do
            BH="$UHOME/.bash_history"
            [ -L "$BH" ] && { echo "[review] $BH is a symlink -> $(readlink "$BH")"; REVIEW=1; }
          done
          echo ""
          if [ $FOUND -gt 0 ]; then
            echo "[SUMMARY: FAIL — backdoor state present, see [!! lines above]"
          elif [ $REVIEW -gt 0 ]; then
            echo "[SUMMARY: REVIEW — see [review] lines above]"
          else
            echo "[SUMMARY: PASS — no scriptlet-backdoor state found]"
          fi
          echo ""
        } >> {{ report_path }}
      args:
        executable: /bin/bash
      ignore_errors: true
      changed_when: true
      tags: [audit]

    # ── §19 AUR helper typosquats + build-time root exposure — Oct 2026 ──────
    # marchos1as uploaded yay/paru look-alikes (yyay, ...) that reuse the real
    # upstream tarball, so they install a working helper AND run linux.sh as
    # root. Edit distance 1 from a helper name catches the shape without a list.
    - name: "[19] AUR helper typosquats and build-time root exposure"
      shell: |
        {
          echo ""
          echo "========================================"
          echo " [19] AUR HELPER TYPOSQUATS + BUILD-TIME ROOT EXPOSURE"
          echo "========================================"
          CACHED=$(ls -1 /root/.cache/yay /root/.cache/paru /home/*/.cache/yay /home/*/.cache/paru 2>/dev/null | grep -v ':$')
          PKGS="$(pacman -Qq 2>/dev/null) $CACHED" python3 - <<'PYEOF'
        import os

        helpers = ["yay", "paru", "pikaur", "trizen", "aura", "pacaur"]
        suffixes = ("-bin", "-git", "-debug")

        def dist(a, b):
            prev = list(range(len(b) + 1))
            for i, ca in enumerate(a, 1):
                cur = [i]
                for j, cb in enumerate(b, 1):
                    cur.append(min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (ca != cb)))
                prev = cur
            return prev[-1]

        def base(n):
            for s in suffixes:
                if n.endswith(s):
                    return base(n[: -len(s)])
            return n

        # Self-check: a broken matcher must not print a PASS.
        assert dist("yyay", "yay") == 1 and dist("parru", "paru") == 1 and dist("yay", "yay") == 0
        assert base("yay-bin-debug") == "yay"

        names = sorted({n for n in os.environ["PKGS"].split() if n})
        hits = []
        for n in names:
            b = base(n)
            if b in helpers:
                continue
            for h in helpers:
                if dist(b, h) == 1:
                    hits.append((n, h))
        if hits:
            for n, h in hits:
                print("[!! FOUND — '%s' is one edit away from AUR helper '%s' (typosquat shape) !!]" % (n, h))
            print("[SUMMARY: FAIL — possible AUR helper typosquat installed or cached]")
        else:
            print("[clean — no installed or cached package name is one edit from an AUR helper]")
            print("[SUMMARY: PASS — no AUR helper typosquats]")
        PYEOF
          echo ""
          echo "--- build-time root exposure (informational) ---"
          echo "[!] gentor/hyprland-fixes called sudo from build()/package(). makepkg runs"
          echo "[!] those as the building user, so any NOPASSWD rule that user holds is"
          echo "[!] root for every AUR package it builds."
          grep -hE '^[^#].*NOPASSWD' /etc/sudoers /etc/sudoers.d/* 2>/dev/null | while read -r L; do
            echo "  [exposure] $L"
            echo "$L" | grep -q '/usr/bin/pacman' \
              && echo "             pacman -U of a crafted package = arbitrary root, no prompt."
          done
          echo ""
        } >> {{ report_path }}
      args:
        executable: /bin/bash
      ignore_errors: true
      changed_when: true
      tags: [audit]

    # ── Overall verdict ───────────────────────────────────────────────────────
    - name: Write overall verdict
      shell: |
        {
          echo ""
          echo "========================================"
          echo " OVERALL VERDICT"
          echo "========================================"
          REPORT="{{ report_path }}"
          if grep -qE '\[!! (MATCH FOUND|MATCH|FOUND|CYRILLIC TEXT DETECTED|JS RUNTIME|SUSPICIOUS INJECTION|COMMITTED ELF IN AUR GIT TREE|SPOOFED / ATTACKER COMMIT METADATA|SUDO GRABBER|TOR CONNECTION|TOR SOFTWARE PRESENT)' "$REPORT" 2>/dev/null \
             || grep -qE '^\[!!\]' "$REPORT" 2>/dev/null; then
            echo "  !! COMPROMISED / REVIEW REQUIRED !!"
            echo "  One or more high-confidence IOCs were detected. See flagged sections above."
            echo "  Recommended actions:"
            echo "    1. Isolate the node from the network immediately."
            echo "    2. Rotate all credentials (SSH keys, tokens, cloud API keys)."
            echo "    3. Boot from live media and inspect flagged files from a trusted OS."
            echo "    4. Consider full reinstall — eBPF rootkits cannot be fully cleaned in-place."
            echo "    5. For Wave 3 spam only: edit the flagged shell config file to remove injected lines."
            echo "    6. For a committed ELF (§15): the AUR account is the breach, not just"
            echo "       this node. Report it to aur-general and check every host that built it."
            echo "    7. For hellscripter/CHAOS (§17): chattr -i the units before removing them,"
            echo "       and treat every host reachable with this node's SSH keys as exposed —"
            echo "       the worm spreads over SSH and pushes into any AUR package it can."
            echo "    8. For scriptlet backdoors (§18): remove extra users/keys/sshd units and"
            echo "       unowned SUID files only after imaging — or just reinstall."
          elif grep -qE '\[SUMMARY: (REVIEW|FAIL)' "$REPORT" 2>/dev/null; then
            echo "  REVIEW — Low-confidence flags present, manual verification recommended."
            echo "  No high-confidence IOCs detected, but some findings warrant inspection."
          else
            echo "  CLEAN — No IOCs detected on this node."
            echo "  All checks passed for the June, Jul-Aug and Aug-Oct 2026 campaigns."
          fi
          echo ""
          echo "  Authoritative second opinion (community tool, now a Python package —"
          echo "  the old aur_check-v2.sh URL is gone):"
          echo "    git clone https://github.com/lenucksi/aur-malware-check"
          echo "    python -m aur_check --scan-all-homes"
          echo "    # or: integration/aur-malware-check.sh"
          echo "  Its data does NOT cover anything after June 2026 — see §2, §15-§19."
          echo "========================================"
          echo ""
        } >> {{ report_path }}
      ignore_errors: true
      changed_when: true
      tags: [audit]

    # ── Fetch & cleanup ───────────────────────────────────────────────────────
    - name: Fetch report to control node
      fetch:
        src: "{{ report_path }}"
        dest: "{{ fetch_dest }}"
        flat: true
      tags: [fetch]

    - name: Remove report and cache files from remote node
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ report_path }}"
        - "{{ pkgdate_cache }}"
      tags: [fetch]
