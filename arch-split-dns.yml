---
# Configure split DNS at runtime (non-persistent) on Arch
# Routes only *.<ad_domain> to the AD DNS and leaves DHCP DNS for everything else.
#
# ad_domain / ad_dns come from group_vars/arch.yml, which is gitignored.
# See lab-env.local.readme for the real values.
- name: Ephemeral split-DNS for the AD domain (systemd-resolved)
  hosts: arch
  become: yes
  gather_facts: yes

  # Prefer the interface Ansible already knows about.
  # If your facts don't contain this (rare), pass -e dns_iface=enp1s0
  vars_prompt: []
  vars_files: []
  pre_tasks:
    - name: Pick default interface from facts (override with -e dns_iface=IFACE if needed)
      set_fact:
        dns_iface: "{{ dns_iface | default(ansible_default_ipv4.interface, true) }}"

    - name: Ensure systemd-resolved is running and enabled
      ansible.builtin.systemd:
        name: systemd-resolved
        state: started
        enabled: true

    - name: Point /etc/resolv.conf at systemd-resolved stub (127.0.0.53)
      ansible.builtin.file:
        src: /run/systemd/resolve/stub-resolv.conf
        dest: /etc/resolv.conf
        state: link
        force: true

  tasks:
    - name: Route *.{{ ad_domain }} to the AD DNS (runtime only)
      ansible.builtin.command:
        cmd: "/usr/bin/resolvectl domain {{ dns_iface }} ~{{ ad_domain }}"
      changed_when: true

    - name: Set DNS server for that interface (runtime only)
      ansible.builtin.command:
        cmd: "/usr/bin/resolvectl dns {{ dns_iface }} {{ ad_dns }}"
      changed_when: true

    - name: Flush resolver cache
      ansible.builtin.command:
        cmd: "/usr/bin/resolvectl flush-caches"
      changed_when: false

    - name: Show current per-link DNS (for visibility)
      ansible.builtin.command:
        cmd: "/usr/bin/resolvectl status {{ dns_iface }}"
      changed_when: false
      register: resolvectl_status

    - name: Print summary
      ansible.builtin.debug:
        msg:
          - "Interface: {{ dns_iface }}"
          - "Routing domain set: ~{{ ad_domain }}"
          - "DNS for {{ ad_domain }} -> {{ ad_dns }}"
          - "Reminder: this is runtime-only and will not survive a reboot."
